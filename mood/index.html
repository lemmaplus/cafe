<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Moody Lemma Looks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<style>
:root { --paper-length:268px; --scene-gap:23px; color-scheme:light; --ink:#232221; --light:#f5f4f1; --dark:#2d2c2a; --background:#fff; --caption-ink:#5e5c58; --gloss-length:24px; }
body.inverted { --ink:#f3f0ec; --light:#292826; --dark:#eeeae4; --background:#171716; --caption-ink:#d5d0c9; }
body.inverted .tile { --tile-color-light:#ece9e3; --tile-color-dark:#282725; }
body.inverted .citation a {border-color:#aaa19a}
body.inverted .footer {color:var(--caption-ink)}
html.inverted {--background:#171716;background:#171716;}
*, *::before, *::after {box-sizing:border-box}
html,body {margin:0;min-height:100%;background:var(--background);} body {background:var(--background);}
/* Opening a long strip must not make mobile Safari re-anchor the whole page. */
html,body,.page {overflow-anchor:none;}
html {scrollbar-gutter:stable;}
body {font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
button {font:inherit}
.page {min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:64px 12px 24px;background:var(--background);}
.logo {position:absolute;left:clamp(18px,3.5vw,32px);top:16px;font:700 19px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.025em;color:var(--ink);text-decoration:none;}
.logo:focus-visible {outline:2px solid #9bcced;outline-offset:4px;border-radius:2px}
.header {text-align:center;margin:0 0 48px;}
.title {display:flex;align-items:center;justify-content:center;gap:.065em;margin:0;font-family:"Baskerville","Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:clamp(28px,5vw,51px);font-weight:700;line-height:1.1;letter-spacing:.025em;white-space:nowrap;color:var(--ink);}
.title .gap {width:.30em;flex:0 0 .30em}
.letter {display:inline-block;line-height:1}
.o {position:relative;border:2px solid currentColor;border-radius:50%;background:none;display:inline-flex;align-items:center;justify-content:center;flex:none;width:.80em;height:.80em;margin:0 .015em;padding:0;color:var(--ink);cursor:pointer;font-family:"Arial Unicode MS","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;font-size:inherit;line-height:1;}
.o .symbol {display:block;color:var(--ink);font-size:.36em;font-weight:600;line-height:1;transform:translateY(-.012em)}
.o.selected {background:var(--ink)}
.o.selected .symbol {visibility:hidden}
.o.black-language {background:var(--ink)}
.o.black-language .symbol {visibility:visible;color:var(--background)}
.o:focus-visible, .letter-button:focus-visible {outline:2px solid #83bde6;outline-offset:4px}
.letter-button {color:inherit;cursor:pointer;border:0;padding:0;margin:0;background:transparent;font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;line-height:1;}
.wall {position:relative;z-index:2;width:min(92vw,784px);aspect-ratio:784 / 836;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(14,minmax(0,1fr));gap:0;isolation:isolate;margin:0;}
.tile {appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;position:relative;display:flex;align-items:center;justify-content:center;overflow:visible;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;background:transparent;min-width:0;min-height:0;touch-action:manipulation;}
.face {position:absolute;inset:0;z-index:3;background:var(--tile-bg);}
.label {position:relative;z-index:4;padding:0 3px;max-width:100%;font:400 clamp(8px,1.55vw,15px)/1.33 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.035em;word-break:keep-all;overflow-wrap:anywhere;color:var(--tile-color);text-align:center;white-space:normal;}
/* Anchor the label independently of native button pressed-state layout. */
.tile .label {position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;transform:none;}
.tile:focus-visible .face {outline:2px solid #6ca9d9;outline-offset:-2px}
.tile.open {z-index:var(--stack,99);pointer-events:none}
.tile.open .face,.tile.open .label {pointer-events:auto}
.tile.open .track,.tile.open .paper,.tile.open .sheet,.tile.open .scene,.tile.open .translation {pointer-events:none}
/* The full page is printed before opening. ONLY the page's position changes.
   The fixed clipping slot ends at the bottom edge of the Korean tile.
   The lower (English) tip emerges first; the full vertical text follows. */
.track {position:absolute;top:calc(100% - 1px);left:7%;width:86%;height:var(--paper-length);z-index:1;overflow:hidden;pointer-events:none;}
.paper {position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;background:var(--mood-color);color:#242321;border:0;border-radius:0;box-shadow:none;transform:translateY(-100%);transition:transform 1.4s cubic-bezier(.35,.02,.65,.98);}
.sheet {position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:32px 7px 3px;gap:var(--scene-gap);}
.tile[data-stage="gloss"] .paper {transform:translateY(calc(-100% + var(--gloss-length,24px)));transition:transform .24s ease-out;}
.tile[data-stage="full"] .paper {transform:translateY(0);transition:transform 9.5s linear;}
.tile[data-stage="gloss-return"] .paper {transform:translateY(calc(-100% + var(--gloss-length,24px)));transition:transform 1.4s cubic-bezier(.35,.02,.65,.98);}
.tile[data-stage="closed"] .paper {transform:translateY(-100%);transition:transform 1.4s cubic-bezier(.35,.02,.65,.98);}
.scene {display:block;flex:1 1 auto;min-width:0;min-height:0;writing-mode:vertical-rl;text-orientation:mixed;text-align:start;font-family:"Noto Serif CJK KR","AppleMyungjo",serif;font-size:clamp(10px,1.3vw,13.2px);line-height:1.36;letter-spacing:.015em;overflow:visible;}
/* Each script uses its own vertical glyph metrics rather than inheriting Chinese forms. */
.scene[lang="ja"] {writing-mode:vertical-rl;text-orientation:mixed;line-break:strict;word-break:normal;overflow-wrap:normal;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif;font-feature-settings:"vert" 1,"vrt2" 1;}
.scene[lang="zh-Hans"] {writing-mode:vertical-rl;text-orientation:mixed;line-break:strict;font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;font-feature-settings:"vert" 1;}
/* Preserve actual Korean word spaces, not artificially widened en spaces. */
.scene[lang="ko"] {writing-mode:vertical-rl;text-orientation:mixed;white-space:normal;word-spacing:0;letter-spacing:0;line-break:normal;word-break:keep-all;overflow-wrap:normal;font-family:"Noto Serif KR","AppleMyungjo","Noto Serif CJK KR","Nanum Myeongjo",serif;font-feature-settings:"vert" 1,"vrt2" 1;}
.translation {display:block;flex:0 0 auto;width:100%;text-align:center;white-space:nowrap;overflow-wrap:normal;word-break:normal;hyphens:none;font:500 clamp(8px,1.08vw,10.7px)/1.18 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:0;transform-origin:center bottom;}
.paper.english .scene {visibility:hidden}
.paper.english .translation {font-weight:500;}


.citation {margin:calc(-1 * var(--paper-length) + 26px + var(--paper-clearance,0px)) auto 0;text-align:center;font:400 11px/1.6 "Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;color:var(--caption-ink);max-width:92vw;position:relative;z-index:0;}
.citation a {color:inherit;text-decoration:none;border-bottom:1px solid #aaa7a1;text-underline-offset:3px}
.citation a:hover {color:var(--ink)}
.footer {display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:calc(8px + var(--row-height,56px));margin-bottom:0;text-align:center;font:400 11px/1.4 -apple-system,BlinkMacSystemFont,Arial,sans-serif;color:var(--caption-ink);position:relative;z-index:0;}
.footer a {color:inherit;text-decoration:none}
.footer a:hover {text-decoration:underline;text-underline-offset:3px}
.clearance {height:calc(var(--paper-length) + 18px);flex:none;width:1px;}
@media(max-width:600px) {
 :root {--paper-length:220px;--scene-gap:3px;}
 .page {padding:66px 6px 16px;}
 .header {margin-bottom:38px;}
 .title {font-size:clamp(28px,7.6vw,39px);gap:.045em}
 .o {border-width:1.8px}
 .logo {left:12px;top:12px;font-size:17px}
 /* Seven columns and fourteen rows: make phone bricks almost square.
    The extra row height leaves room for the English paper tip below a tile. */
 .wall {width:calc(100vw - 12px);aspect-ratio:7 / 13}
 /* Keep the original lower-edge rhythm, with a small, deliberate inset. */
 .tile .label {align-items:flex-end;transform:none;padding-bottom:3px}
 .label {font-size:clamp(7.3px,2.01vw,10.7px);padding:0 1px;letter-spacing:-.055em}
 .track {left:3%;width:94%;height:var(--paper-length)}
 .sheet {gap:var(--scene-gap);padding:10px 3px 3px}
 .scene {font-size:10.3px;line-height:1.2;letter-spacing:0}
 /* The English tip has one stable line box even when a long word needs a
    smaller type size. Prevent Safari's automatic text enlargement. */
 .translation {font-size:clamp(7px,2.18vw,8.5px);height:11px;flex:0 0 11px;line-height:11px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
 .citation {font-size:10px;margin-top:calc(-1 * var(--paper-length) + 22px + var(--paper-clearance,0px));padding:0 5px}
 .footer {margin-top:calc(8px + var(--row-height,28px))}
}
@media(max-width:360px) { :root {--paper-length:240px;} .scene[lang="ko"] {font-size:10px;} }
@media(prefers-reduced-motion:reduce) {.paper,.o,body,.clearance{transition:none!important}}

.scene{max-width:100%;width:100%;overflow-wrap:anywhere;}
.scene.columns-2{width:min(100%,3em);max-width:min(100%,3em)}
.scene.columns-3{width:min(100%,4.5em);max-width:min(100%,4.5em)}
.scene strong{font-weight:700}
.dictionary-example[lang="ko"]{font-family:"Noto Serif KR","AppleMyungjo","Noto Serif CJK KR",serif;word-spacing:0;letter-spacing:0}
.letter-button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:.13em;text-decoration-thickness:1px}
body[data-mode="drama"] .tile[data-available="false"] .label,
body[data-mode="scene"] .tile[data-available="false"] .label{opacity:.56}
.dialogue-context{opacity:1;font-size:inherit}
.dialogue-quote{font-weight:400}
.scene-credit{letter-spacing:0;word-spacing:0;text-orientation:upright}
.quote-mark{text-orientation:mixed;font-feature-settings:"vert" 1,"vrt2" 1}
.scene[lang="ko"] .quote-mark{font-family:"Noto Serif CJK KR","Noto Serif KR",serif}
.scene-credit{font:400 8px/1.15 "Noto Sans KR",sans-serif;opacity:.74;white-space:normal}
/* The original little scenes keep their familiar papers. A dictionary leaf is
   quieter; a drama fragment gets more room to unfold. No extra marks. */
.tile[data-printed-mode="dictionary"] .paper{background:color-mix(in srgb,var(--mood-color) 74%,#f6f2e9)}
.tile[data-printed-mode="dictionary"] .dictionary-lemma{font-weight:700}
.tile[data-printed-mode="scene"] .paper{background:color-mix(in srgb,var(--mood-color) 84%,#d0c6bf)}

.catalogue-dot{border:0;background:none;color:inherit;font-size:17px;cursor:pointer;min-width:36px;min-height:30px}
.catalogue-dot:focus-visible{outline:2px solid #83bde6;outline-offset:3px}
dialog{width:min(600px,94vw);max-height:85svh;padding:24px;border:1px solid var(--caption-ink);background:var(--background);color:var(--ink);font-size:13px;line-height:1.7;overflow:auto}
dialog::backdrop{background:#0007}
dialog h2{font:26px Georgia,serif;margin:0}
.catalogue-head{display:flex;justify-content:space-between;align-items:center}
dialog button{border:0;background:none;color:inherit;cursor:pointer;padding:10px;font:inherit}
#catalogue-close{font-size:25px}
.catalogue-entry{padding:14px 0;border-bottom:1px solid #8885}
.catalogue-entry p{margin:6px 0}
.catalogue-entry a{color:inherit;text-underline-offset:3px}
dialog details{margin:10px 0}dialog summary{cursor:pointer}

/* Centre the vertical text within the paper, with a separate quiet band
   above the English tip. Keep the tip's type, baseline and bottom pad intact. */
.scene {width:auto;max-width:100%;text-align:center;}
.scene.columns-2 {width:auto;max-width:min(100%,3em);}
.scene.columns-3 {width:auto;max-width:min(100%,4.5em);}
/* Only on mobile: centre the two-column group horizontally, start its lines
   at the top. Desktop keeps the earlier vertical centring. */
@media(max-width:600px){
  .tile:not([data-printed-mode="dictionary"]) .scene.columns-2 {text-align:start;}
}
.tile[data-printed-mode="original"] .scene {width:auto;max-width:100%;}
.scene[lang="ko"] {text-orientation:upright;letter-spacing:.075em;word-spacing:.225em;}
.scene-credit[lang="ko"] {letter-spacing:.075em;word-spacing:.225em;}
.sheet {padding:32px 7px 3px;gap:var(--scene-gap);}
@media(max-width:600px){.sheet {padding:10px 3px 3px;gap:var(--scene-gap);}}
/* The mobile English tip keeps its compact 3px separation. Above it, the
   CJK scene gets its own margins instead of being pressed to the paper edge.
   Dictionary leaves retain their existing centred layout. */
@media(max-width:600px){
  .tile:not([data-printed-mode="dictionary"]) .sheet {padding-top:19px;}
}
/* Give successive vertical glyphs room, without moving the English tip. */
.tile[data-printed-mode="original"] .scene {letter-spacing:.12em;}
.ko-space {display:inline-block;inline-size:.65em;block-size:1em;letter-spacing:0;word-spacing:0;}
/* Phone paper typography: option B. Keep desktop and the English tip intact. */
@media(max-width:600px){
  .tile:not([data-printed-mode="dictionary"]) .sheet,
  .tile[data-printed-mode="dictionary"] .sheet {padding-top:24px;}
  .tile .scene {flex:0 0 auto;min-height:0;text-align:start;}
  .tile .scene.columns-1 {width:auto;max-width:min(100%,1.5em);}
  .tile .scene.columns-2 {width:auto;max-width:min(100%,3em);}
}
/* Pointer input should not select the controls or leave a native blue flash.
   Keyboard users retain a visible, monochrome focus outline. */
button,.logo {-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.title,.wall {-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
button:focus:not(:focus-visible),.logo:focus:not(:focus-visible) {outline:none;}
.tile:focus:not(:focus-visible) .face {outline:none;}
.o:focus-visible,.letter-button:focus-visible,.logo:focus-visible,
.catalogue-dot:focus-visible {outline-color:var(--ink);}
.tile:focus-visible .face {outline-color:var(--tile-color);}
.switching-theme .paper {transition:none!important;}
/* All vertical columns start at the same top edge. */
.tile .scene {text-align:start;}
/* Give drama/scene text breathing room without enlarging the English tip. */
.tile[data-printed-mode="drama"] .sheet,
.tile[data-printed-mode="scene"] .sheet {padding-top:32px;padding-left:8px;padding-right:8px;gap:24px;}
.tile[data-printed-mode="drama"] .scene[lang="ko"],
.tile[data-printed-mode="scene"] .scene[lang="ko"] {line-height:1.5;}
@media(max-width:600px){
 .tile[data-printed-mode="drama"] .sheet,
 .tile[data-printed-mode="scene"] .sheet {padding-top:28px;padding-left:5px;padding-right:5px;gap:22px;}
 .tile[data-printed-mode="drama"] .scene[lang="ko"],
 .tile[data-printed-mode="scene"] .scene[lang="ko"] {line-height:1.45;}
}
/* Quotes occupy their own vertical advances, not a floating glyph over a dot. */
.dialogue-quote .quote-mark {
 display:inline-block;box-sizing:border-box;
 inline-size:1.2em;block-size:1em;line-height:1;
 vertical-align:middle;letter-spacing:0;word-spacing:0;
 text-orientation:upright;font-kerning:none;
}
.dialogue-quote .quote-close {margin-inline-start:.18em;}
</style>
</head>

<div class="page" id="page">
  <a class="logo" href="https://ooo.pilemma.org" aria-label="Pilemma home" title="pilemma">pilemma</a>
  <header class="header">
    <h1 class="title" aria-label="MOOD BOARD">
      <span class="letter">M</span>
      <button type="button" class="o" data-lang="zh" aria-label="中文" title="中文"><span class="symbol">中</span></button>
      <button type="button" class="o" data-lang="ko" aria-label="한국어" title="한국어"><span class="symbol">한</span></button>
      <button type="button" class="letter-button" id="drama" aria-label="Drama quotations" title="Drama quotations">D</button>
      <span class="gap" aria-hidden="true"></span>
      <span class="letter">B</span>
      <button type="button" class="o" data-lang="ja" aria-label="日本語" title="日本語"><span class="symbol">あ</span></button>
      <button type="button" class="letter-button" id="english" aria-label="Switch to English only" title="Light view → English only">A</button>
      <span class="letter">R</span><button type="button" class="letter-button" id="dictionary" aria-label="Dictionary" title="Dictionary">D</button>
    </h1>

  <footer class="footer"><span>© Pilemma 2026</span><a href="https://ooo.pilemma.org">ooo.pilemma.org</a></footer>

<script>
'use strict';
const moods = [{"ko":"가라앉는","en":"sinking","strip":"#8ea4b8","zh":"考完试，一个人走出校门。街上还是那么热闹，我却一句话也不想说。","ko_note":"막차가 떠난 플랫폼에서 마음도 천천히 가라앉는 밤.","ja":"文化祭が終わり、教室の飾りを一つずつ外していく。さっきまであんなににぎやかだったのに。"},{"ko":"겁나는","en":"afraid","strip":"#a598c8","zh":"电梯到了面试那层，门一开，手心忽然全是汗。","ko_note":"면접장 손잡이 앞에서 겁나는 마음이 먼저 땀을 흘린다.","ja":"初めてのバイト面接。店の引き戸に手をかけたまま、しばらく動けない。"},{"ko":"기쁜","en":"joyful","strip":"#f3d36b","zh":"等了好久的消息终于来了，连下楼买饭都忍不住哼歌。","ko_note":"기쁜 소식 하나에 한강 바람까지 달게 느껴진다.","ja":"帰りの電車で合格の知らせを読む。窓に映った自分が、にやにやしている。"},{"ko":"당황스러운","en":"flustered","strip":"#d6a46b","zh":"开会时突然被点名，刚想好的话一下子全忘了。","ko_note":"정적 속 이름이 불리는 당황스러운 순간, 볼부터 뜨거워진다.","ja":"ゼミで突然名前を呼ばれた。開いていたノートの文字が、一瞬読めなくなった。"},{"ko":"무서운","en":"scared","strip":"#6f7f99","zh":"楼道的灯突然灭了，身后那阵脚步声也跟着停住。","ko_note":"불 꺼진 복도 끝에서 들린 발소리가 무서운 밤.","ja":"終電を降りて階段を上ると、後ろの足音も少し速くなった。"},{"ko":"분한","en":"resentful","strip":"#cf6d5c","zh":"忙了一星期，功劳却算在别人头上。回家路上越想越气。","ko_note":"잘못도 없는데 사과하라니, 분한 마음에 입술만 깨문다.","ja":"一週間かけた資料を他人の手柄にされた。帰り道も悔しくて、何度もその場面を思い返してしまう。"},{"ko":"속상한","en":"upset","strip":"#9aa7c9","zh":"别人随口说的一句话，回到家却越想越难受，连饭都不想吃。","ko_note":"정성껏 싼 도시락이 그대로 돌아온 속상한 오후.","ja":"頑張って作ったお弁当が、ほとんど手つかずで戻ってきた。何も言えずにふたを閉めた。"},{"ko":"아쉬운","en":"wistful","strip":"#88a9a0","zh":"朋友进站前又回头挥了挥手，偏偏还有好多话没说。","ko_note":"막차 문이 닫힐 때 남은 인사가 아쉬운 밤.","ja":"終電のベルが鳴る。もう少しだけ話していたかった。"},{"ko":"원망스러운","en":"resentful","strip":"#b88578","zh":"答应得好好的，最后却让我一个人收拾残局。","ko_note":"약속을 잊은 너를 생각하면 원망스러운 마음이 스친다.","ja":"約束の時間を過ぎても、改札に相手の姿が見えない。今度こそ一言言ってやろうと思う。"},{"ko":"즐거운","en":"delighted","strip":"#f2c84d","zh":"和老朋友吃顿火锅，聊到店员来催打烊还不想走。","ko_note":"친구와 떡볶이를 나눠 먹는 즐거운 귀갓길.","ja":"友達とくだらない話で笑い合っていたら、乗るはずの電車を一本見送っていた。"},{"ko":"가벼운","en":"lighthearted","strip":"#c7d89b","zh":"挂心了好几天的事终于解决。走出门时，整个人都轻快了。","ko_note":"마감 끝낸 어깨 위로 가벼운 봄바람이 지난다.","ja":"心配していたことが片づいた。帰り道の階段も、いつもより軽い足取りで上れた。"},{"ko":"고단한","en":"worn-out","strip":"#9f8f88","zh":"末班公交上找到座位，眼睛一闭，整天的疲惫才涌上来。","ko_note":"버스 맨 뒷자리, 고단한 하루가 눈꺼풀에 앉는다.","ja":"残業帰りの電車で座れた途端、眠気がどっと押し寄せた。"},{"ko":"긴장한","en":"tense","strip":"#d9997c","zh":"讲台就在前面，手里的讲稿却被汗浸湿了一个角。","ko_note":"발표 직전, 긴장한 손끝이 종이 모서리를 만진다.","ja":"発表の順番が近づく。ノートを持つ手がじんわり汗ばんできた。"},{"ko":"든든한","en":"reassured","strip":"#7fae8f","zh":"从车站出来，看见有人在等我，忽然觉得今天也没那么糟。","ko_note":"비 오는 날 문밖까지 나온 사람이 든든한 밤.","ja":"改札の向こうに迎えに来てくれた人が見えた。それだけでほっとした。"},{"ko":"뭉클한","en":"moved","strip":"#d49a9d","zh":"收拾旧书时翻出妈妈留的纸条，读着读着鼻子就酸了。","ko_note":"할머니의 오래된 손글씨를 보면 뭉클한 마음이 인다.","ja":"久しぶりに食べた母の卵焼き。いつもと同じ味なのに、胸が熱くなる。"},{"ko":"불안한","en":"anxious","strip":"#9099b8","zh":"消息发出去半小时了，手机一亮，心就跟着一紧。","ko_note":"답장이 늦은 밤, 불안한 상상이 휴대폰만 밝힌다.","ja":"大事な結果を待つ夜。通知が来ていないか、何度もスマホの画面をつけてしまう。"},{"ko":"수줍은","en":"shy","strip":"#d8a7be","zh":"被当面夸了一句，嘴上说着没有，耳朵却先红了。","ko_note":"마주친 눈을 피해 웃는 수줍은 고백의 첫마디.","ja":"好きな人が隣の席に座った。プリントを渡すだけなのに、指先までぎこちない。"},{"ko":"안타까운","en":"pained","strip":"#a9a1c8","zh":"朋友落榜了。我陪她走了一路，却不知道该说什么。","ko_note":"우산 없이 서 있는 아이를 보니 안타까운 발걸음.","ja":"試験に落ちた友達と帰る道。何と言えばいいかわからず、ただ隣を歩いた。"},{"ko":"위축되는","en":"intimidated","strip":"#a7a3a0","zh":"一句批评之后，原本想说的话也不敢再开口了。","ko_note":"날카로운 한마디에 위축되는 목소리가 작아진다.","ja":"会議で何度も話を遮られて、次に順番が来ても小さくうなずくだけになる。"},{"ko":"지겨운","en":"fed-up","strip":"#b0a687","zh":"同一份材料改到第八遍，听见“再调整一下”就想叹气。","ko_note":"한없이 반복되는 공지, 지겨운 월요일의 회의.","ja":"「もう一度直してください」。また同じところを指摘されて、思わずため息が出た。"},{"ko":"가뿐한","en":"sprightly","strip":"#bedd9a","zh":"睡了个好觉，醒来时窗外阳光正好，整个人都轻快了。","ko_note":"과제를 낸 아침, 가뿐한 발걸음으로 계단을 오른다.","ja":"久しぶりにぐっすり眠れた朝。駅までの坂道も今日は苦にならない。"},{"ko":"고독한","en":"solitary","strip":"#8f95a9","zh":"饭桌上坐满了人，却找不到一个能说心里话的。","ko_note":"불 켜진 창문들 사이 고독한 내 방 하나.","ja":"満員電車の中で、今日は誰ともまともに話していないことに気づく。"},{"ko":"낙담한","en":"discouraged","strip":"#9ba5b4","zh":"名单上没有我的名字。回家的路突然变得很长。","ko_note":"합격자 명단을 접고 낙담한 채 지하철에 오른다.","ja":"何度も練習したオーディションに落ちた。駅までの坂道がいつもより長い。"},{"ko":"들뜬","en":"excited","strip":"#f0b35a","zh":"车票买好了，行李还没收拾，心早就飞到海边了。","ko_note":"여행 전날, 들뜬 마음에 짐을 세 번이나 다시 싼다.","ja":"花見の約束が決まった。帰り道、桜の開花予報を何度も見てしまう。"},{"ko":"뭔가 아닌 것 같은","en":"off","strip":"#c1a89e","zh":"大家都笑着说没问题，我却总觉得有哪里不对劲。","ko_note":"모두 웃는데 뭔가 아닌 것 같은 저녁 식탁.","ja":"みんなは納得している。でも、どうしても引っかかるところがある。"},{"ko":"불쾌한","en":"unpleasant","strip":"#a5948f","zh":"他说“开玩笑的”，可那句话直到回家还让我不舒服。","ko_note":"농담이라며 넘긴 한마디가 불쾌한 밤으로 남는다.","ja":"冗談のつもりだと言われた一言が、帰宅しても耳の奥に残っている。"},{"ko":"숨 막히는","en":"suffocating","strip":"#7c8c9b","zh":"地铁里挤得动弹不得，只盼着下一站快点到。","ko_note":"만석인 막차 안, 숨 막히는 침묵과 젖은 우산.","ja":"満員電車で身動きが取れない。降りる駅の名前だけを何度も確かめる。"},{"ko":"애틋한","en":"tender","strip":"#e1a0a8","zh":"小时候常戴的围巾现在已经太短了，翻出来还是舍不得扔。","ko_note":"오래 입은 교복을 접는 애틋한 졸업식 저녁.","ja":"引っ越しの荷物から小学生のころの手紙が出てきた。捨てようと思ったのに、もう一度読み返してしまう。"},{"ko":"유쾌한","en":"cheerful","strip":"#f3c85f","zh":"一句玩笑把大家逗得前仰后合，连尴尬都散了。","ko_note":"비 맞은 신발도 웃음거리가 되는 유쾌한 귀갓길.","ja":"雨で靴までびしょぬれなのに、友達のひと言で笑いが止まらない。"},{"ko":"창피한","en":"embarrassed","strip":"#d79d88","zh":"当众把人叫错了名字，真想当场钻进地缝里。","ko_note":"틀린 답을 큰 소리로 읽은 창피한 기억이 떠오른다.","ja":"みんなの前で名前を呼び間違えた。穴があったら入りたい。"},{"ko":"가슴 아픈","en":"heartbroken","strip":"#8d90b7","zh":"又路过那家已经关门的小店，想起以前常常一起去吃饭的人。","ko_note":"비어 있는 신발 한 켤레가 가슴 아픈 아침.","ja":"もう閉店したあの店の前を通ると、一緒に来た人の顔を思い出す。"},{"ko":"고요한","en":"serene","strip":"#99c0bb","zh":"清晨街上还没什么车，连自己的脚步声都听得清。","ko_note":"눈 내린 골목, 고요한 새벽의 우유 배달 소리.","ja":"始発前のホーム。風だけが通り過ぎ、まだ誰も急いでいない。"},{"ko":"난처한","en":"in a bind","strip":"#c9ae82","zh":"两个人同时约我周末见面，答应谁都不好。","ko_note":"두 약속이 겹친 난처한 토요일 오후.","ja":"頼まれたけれど、どうしても断りたい。相手がにこにこしているので、ますます言い出せない。"},{"ko":"떨떠름한","en":"unconvinced","strip":"#b4a48c","zh":"道歉倒是收到了，可那句话听着还是不太舒服。","ko_note":"칭찬인 듯한 그 말이 떨떠름한 뒷맛으로 남는다.","ja":"謝ってもらえたのに、最後のひと言が気になって素直に笑えない。"},{"ko":"미심쩍은","en":"suspicious","strip":"#8f93a0","zh":"账单上的数字怎么也对不上，我把小票又看了一遍。","ko_note":"영수증의 작은 숫자가 미심쩍은 밤.","ja":"受け取ったレシートの合計が少しおかしい。帰り道も気になってしまう。"},{"ko":"불행한","en":"unfortunate","strip":"#7d8aa8","zh":"坏消息接连不断。明明是晴天，出门也提不起劲。","ko_note":"잇따른 안 좋은 소식, 불행한 하루가 끝나지 않는다.","ja":"やっと落ち着いたと思ったら、また悪い知らせが来た。今日は何をする気にもなれない。"},{"ko":"슬픈","en":"sad","strip":"#7f97b4","zh":"想说的话到了嘴边，最后只剩一句“那我走了”。","ko_note":"오래 듣던 노래가 슬픈 이별을 다시 데려온다.","ja":"「じゃあね」と手を振って別れたあと、しばらく足が進まなかった。"},{"ko":"포근한","en":"cozy","strip":"#f1d0a3","zh":"刚晒过的被子有太阳的味道，钻进去就不想出来。","ko_note":"온돌 바닥과 귤 향이 포근한 겨울밤을 만든다.","ja":"こたつに足を入れた瞬間、もう外には出たくなくなった。"},{"ko":"통쾌한","en":"exhilarated","strip":"#ee8f55","zh":"憋了半天的话终于说出口，走出门时真想大笑一声。","ko_note":"밀린 말을 드디어 다 하고 난 통쾌한 퇴근길.","ja":"ずっと我慢していたことを、ようやくはっきり言えた。店を出たら、思わず笑ってしまった。"},{"ko":"초라한","en":"diminished","strip":"#b39c90","zh":"站在一群盛装打扮的人中间，忽然不知该把手放哪儿。","ko_note":"축하 꽃다발들 곁에서 초라한 내 손이 숨는다.","ja":"華やかな人たちの輪の中で、自分の服ばかり気になってしまう。"},{"ko":"간절한","en":"fervent","strip":"#cc8e64","zh":"比赛前一晚，把准备了好几个月的作品又看了一遍。心里只有一个念头：一定要选上。","ko_note":"새벽 절집의 종소리에도 간절한 바람이 실린다.","ja":"合格発表まであと一時間。お守りを握る手をなかなか離せない。"},{"ko":"고통스러운","en":"painful","strip":"#8c7f9a","zh":"手术后第一次下床，连走到门口都疼得直冒冷汗。","ko_note":"계속 울리는 알람조차 고통스러운 이별 뒤 아침.","ja":"手術の翌朝、寝返りを打つだけでも痛くて、思わず息を止めた。"},{"ko":"날아갈 듯한","en":"elated","strip":"#f4c66d","zh":"录取通知一到，恨不得一路跑着去告诉所有人。","ko_note":"장학금 문자 하나, 날아갈 듯한 기쁨이 발끝에.","ja":"うれしい知らせを受け取って、駅の階段を飛ぶように駆け上がった。"},{"ko":"떨리는","en":"trembling","strip":"#c98da1","zh":"刷新结果页面的时候，指尖都跟着心跳发抖。","ko_note":"발표 직전, 떨리는 목소리가 마이크를 만난다.","ja":"合格発表のページを開く。画面を押さえる指先まで震えている。"},{"ko":"미안한","en":"sorry","strip":"#8fb4b8","zh":"想了半天只发出去三个字：“对不起。”","ko_note":"놓친 약속 앞에 미안한 문자만 길어진다.","ja":"返信を書いては消し、最後に「ごめんね」だけを送った。"},{"ko":"뿌듯한","en":"proud","strip":"#e6b85d","zh":"终于把那幅画画完，退后两步看了又看。","ko_note":"내 이름이 적힌 책등을 만지는 뿌듯한 저녁.","ja":"部活でずっと練習していた技が初めてできた。帰り道も、何度もその瞬間を思い出した。"},{"ko":"신나는","en":"excited","strip":"#f2a542","zh":"音乐一响，脚就开始打拍子，恨不得马上出门。","ko_note":"기차표를 손에 쥐면 신나는 여행이 벌써 시작된다.","ja":"ライブの一曲目が始まった瞬間、体が勝手にリズムを刻んでいた。"},{"ko":"어리둥절한","en":"bewildered","strip":"#a694c3","zh":"大家突然一起看向我，我愣了半天才弄明白发生什么。","ko_note":"갑자기 바뀐 시간표 앞에 어리둥절한 눈동자들.","ja":"駅の案内が急に変わって、どのホームへ行けばいいのかわからない。"},{"ko":"절망적인","en":"hopeless","strip":"#6f748a","zh":"能想到的办法都试过了，还是一点起色也没有。关上电脑后，在桌前坐了很久。","ko_note":"빈 접수창을 보며 절망적인 새벽을 버틴다.","ja":"考えられる方法は全部試した。それでも解決できず、しばらく画面を見つめていた。"},{"ko":"충만한","en":"fulfilled","strip":"#d9c16d","zh":"忙了一整天，饭做好了，屋子也收拾干净了。终于坐下时，正好看见晚霞。","ko_note":"별일 없는 일요일, 충만한 낮잠 뒤의 햇살.","ja":"やることを全部終えて、ゆっくりお茶をいれる。今日はよく動いたなと思う。"},{"ko":"갈망하는","en":"yearning","strip":"#d69378","zh":"每次路过那家剧院，都忍不住看一眼门口的演出海报。真想有一天，自己也能站上那座舞台。","ko_note":"멀리 바다가 보일 때마다 갈망하는 여행의 계절.","ja":"どうしても入りたい学校がある。帰り道にその校門が見えると、また足を止めてしまう。"},{"ko":"공허한","en":"empty","strip":"#9fa3af","zh":"热闹一散，房间还是原来的房间，却空得厉害。","ko_note":"손님이 모두 떠난 뒤 공허한 찻잔만 남는다.","ja":"忙しかった一日が終わった。やっと静かになった部屋で、何をしていいかわからない。"},{"ko":"넋 나간","en":"spaced-out","strip":"#b0afb7","zh":"人坐在桌前，朋友叫了两声才回过神来。","ko_note":"눈은 창밖에, 마음은 먼 곳에 간 넋 나간 오후.","ja":"呼ばれても気づかず、友達に肩をたたかれてようやく顔を上げた。"},{"ko":"막막한","en":"overwhelmed","strip":"#899bb4","zh":"明天就要交了，文档还是空白，连从哪儿写起都不知道。","ko_note":"첫 장을 못 펴는 막막한 졸업 논문 첫날.","ja":"締切は明日なのに、画面にはまだ白いページが開いている。"},{"ko":"민망한","en":"abashed","strip":"#d1a58f","zh":"电梯里认错了人，只好对着楼层数字假装发呆。","ko_note":"인사하려는데 이름이 기억 안 나는 민망한 엘리베이터.","ja":"初対面の人に「前にも会いましたよね」と言われた。思い出せず、曖昧に笑ってしまった。"},{"ko":"산뜻한","en":"fresh","strip":"#a5d4ba","zh":"雨刚停，换上干净衣服出门。迎面吹来的风凉凉的。","ko_note":"비 갠 다음 날, 산뜻한 운동화가 골목을 지난다.","ja":"雨が上がったので窓を開ける。湿った土の匂いがして、気持ちいい。"},{"ko":"실망한","en":"disappointed","strip":"#8ea2b0","zh":"盼了一个星期的展览，走进去才发现最想看的那幅画没展出。","ko_note":"기다린 연락이 한 줄뿐인 실망한 밤.","ja":"楽しみにしていた限定のお菓子が売り切れだった。遠くまで来たのに、とがっかりした。"},{"ko":"어색한","en":"awkward","strip":"#b7a7a0","zh":"很久没见的同学坐在对面，寒暄完就不知道说什么了。","ko_note":"오랜 친구와 말끝을 고르는 어색한 카페 테이블.","ja":"駅前で昔の同級生にばったり会った。「久しぶり」のひと言が、なぜかぎこちない。"},{"ko":"조급한","en":"impatient","strip":"#d78d70","zh":"看了十几次时间，电梯的数字还是慢吞吞往上跳。","ko_note":"초록불마저 느리게 보이는 조급한 출근길.","ja":"改札を抜けたら発車ベルが鳴った。間に合って！と思いながら階段を駆け上がる。"},{"ko":"평화로운","en":"peaceful","strip":"#9ecab0","zh":"周日下午什么也不用赶，窗台上的花开得正好。","ko_note":"담장 너머 밥 짓는 냄새, 평화로운 일요일.","ja":"休日の縁側。湯のみの茶が冷めても、誰も急かさない。"},{"ko":"감격스러운","en":"deeply moved","strip":"#e7a46d","zh":"终于听到自己的名字，笑着笑着眼泪却下来了。","ko_note":"오랜 기다림 끝의 악수, 감격스러운 눈물이 난다.","ja":"何か月も練習してきた。舞台で名前を呼ばれた瞬間、拍手の中で涙が出た。"},{"ko":"괜찮은","en":"okay","strip":"#b7c9a9","zh":"事情没做到满分，不过今天这样也已经很好了。","ko_note":"조금 틀려도 괜찮은 오늘, 창문을 연다.","ja":"少し失敗したけれど、今日の自分にはこれで十分だと思えた。"},{"ko":"놀라운","en":"astonishing","strip":"#f1b76d","zh":"抬头一看，昨晚还光秃秃的树，今天竟然开满了花。","ko_note":"골목 틈에서 피어난 꽃이 놀라운 봄을 알린다.","ja":"何年も会っていなかった友達が、偶然同じ電車に乗っていた。声をかけられるまで気づかなかった。"},{"ko":"만족스러운","en":"satisfying","strip":"#d8c47a","zh":"最后一只碗也洗好了，厨房干干净净，心里很踏实。","ko_note":"마지막 그릇까지 씻고 나니 만족스러운 저녁이다.","ja":"最後の皿を洗い終える。台所がきれいだと、それだけでうれしい。"},{"ko":"반가운","en":"glad","strip":"#f0c385","zh":"远远看见熟悉的身影，名字已经先喊出了口。","ko_note":"역 출구에서 마주친 반가운 얼굴, 이름이 먼저 나온다.","ja":"遠くに住む友達が改札から出てきた。顔を見た瞬間、思わず駆け寄った。"},{"ko":"상쾌한","en":"refreshing","strip":"#a2d4cf","zh":"推开窗，凉风扑了满脸，昨晚的烦闷也散了。","ko_note":"샤워 뒤 연 창문, 상쾌한 바람이 목덜미를 지난다.","ja":"窓を開けると冷たい風が入ってきて、眠気まで吹き飛んだ。"},{"ko":"심술 나는","en":"spiteful","strip":"#c07a7f","zh":"明明没什么大事，偏偏就想和人唱反调。","ko_note":"내 과자만 빼놓다니, 심술 나는 오후다.","ja":"相手が楽しそうにしているのを見て、つい意地悪なことを言いたくなる。"},{"ko":"어이없는","en":"dumbfounded","strip":"#b69f95","zh":"排了一个小时的队，好不容易轮到我，窗口却说“今天不办了”。","ko_note":"주머니에 안경을 넣고 찾던 어이없는 아침.","ja":"一時間並んで、ようやく順番が来たところで「今日は受付終了です」と言われた。"},{"ko":"편안한","en":"comfortable","strip":"#c2d6b6","zh":"坐在那家熟悉的小店，不用点单，老板就记得我要什么。","ko_note":"말없이 앉아도 편안한 우리 동네 책방.","ja":"喫茶店のいつもの席。店員さんが何も聞かずに水を置いてくれる。"},{"ko":"혼란스러운","en":"confused","strip":"#988fb4","zh":"电话还没挂，消息又弹出来，脑子里乱成一团。","ko_note":"서로 다른 세 개의 전화가 울리는 혼란스러운 오후.","ja":"乗り換え案内が急に変わった。知らないホームに立ち、頭が真っ白になる。"},{"ko":"감동적인","en":"touching","strip":"#e2a68d","zh":"下雨时有人悄悄把伞往我这边挪了挪。","ko_note":"낯선 이가 우산을 내어 준 감동적인 귀갓길.","ja":"雨の中、知らない人が傘をこちらに少し傾けてくれた。"},{"ko":"괴로운","en":"tormented","strip":"#857e9f","zh":"那件事早就过去了，夜里想起来还是睡不着。","ko_note":"읽지 않은 메시지를 붙들고 괴로운 밤이 깊다.","ja":"夜中にふと思い出す。終わったことなのに、まだ胸が痛い。"},{"ko":"다행스러운","en":"relieved","strip":"#a5c7a1","zh":"钱包找回来了，站在派出所门口，终于长出一口气。","ko_note":"잃어버린 지갑을 찾은 다행스러운 금요일.","ja":"なくした定期券が駅の窓口に届いていた。思わず「よかった」と声が出た。"},{"ko":"멍한","en":"dazed","strip":"#b8b2ac","zh":"咖啡放凉了很久，回过神才发现自己一直望着窗外。","ko_note":"커피가 식는 줄도 모르는 멍한 점심시간.","ja":"喫茶店でコーヒーを一口も飲まずに、ずっと窓の外を見ていた。"},{"ko":"버거운","en":"burdened","strip":"#9f8b83","zh":"消息一条接一条地来，连吃饭都觉得费力。","ko_note":"끝나지 않는 부탁들이 버거운 퇴근길.","ja":"仕事の連絡が次々届く。コンビニの夕飯を前に、箸を持つ力も残っていない。"},{"ko":"서러운","en":"sorrowing","strip":"#9c8db3","zh":"白天还好好的，听见妈妈问“累不累”，眼泪就下来了。","ko_note":"괜찮냐는 엄마의 한마디에 서러운 눈물이 난다.","ja":"「大丈夫？」と聞かれた瞬間、我慢していた涙がこぼれた。"},{"ko":"쑥스러운","en":"bashful","strip":"#d8afb7","zh":"被认真夸了一句，只好低头摆弄衣角。","ko_note":"칭찬받고 소매 끝만 만지는 쑥스러운 손.","ja":"先生に作文を褒められた。うれしいのに、みんなの前では顔を上げられなかった。"},{"ko":"억울한","en":"wronged","strip":"#c37a72","zh":"明明不是我做的，却怎么解释都没人肯听。","ko_note":"하지도 않은 말을 했다는 소문이 억울한 밤.","ja":"やっていないことを注意された。言い返せず、廊下で唇をかむ。"},{"ko":"좌절하는","en":"frustrated","strip":"#8f91a5","zh":"改了无数遍还是被退回来，忍不住怀疑自己是不是真的不行。","ko_note":"지운 원고를 다시 쓰며 좌절하는 새벽.","ja":"何度書き直しても原稿が戻ってくる。つい、自分が嫌になる。"},{"ko":"홀가분한","en":"unburdened","strip":"#bcd7a7","zh":"把拖了几个月的事办完，回家路上脚步都轻了。","ko_note":"마지막 택배를 보내고 홀가분한 숨을 쉰다.","ja":"気になっていた用事を全部片づけて、帰り道で思いきり伸びをした。"},{"ko":"감사한","en":"grateful","strip":"#e3c483","zh":"门口放着一碗热粥，不用问也知道是谁送来的。","ko_note":"문 앞에 놓인 죽 한 그릇, 감사한 마음이 오래 간다.","ja":"大雨の中、見知らぬ人が駅まで傘に入れてくれた。何度もお礼を言った。"},{"ko":"귀찮은","en":"a hassle","strip":"#aaa59a","zh":"衣服都洗好了，光是想到要晾出去就不想动。","ko_note":"젖은 양말을 벗는 것조차 귀찮은 비 오는 날.","ja":"洗濯機がピーピー鳴っている。取りに行かなきゃと思いながら、まだ布団にいる。"},{"ko":"답답한","en":"stifled","strip":"#879ab0","zh":"解释了半天，对方还是没听懂，胸口闷得慌。","ko_note":"열 번 설명해도 전해지지 않는 답답한 오후.","ja":"会議がなかなか終わらない。言いたいことはあるのに、口を挟むタイミングがない。"},{"ko":"못마땅한","en":"displeased","strip":"#b08e7f","zh":"说好大家一起商量，结果他一个人全做了决定。","ko_note":"대충 넘기는 대답이 못마땅한 회의실.","ja":"みんなで決めたはずなのに、何の相談もなく予定を変えられた。返事をする気になれない。"},{"ko":"부끄러운","en":"ashamed","strip":"#c99696","zh":"发现自己冤枉了别人，道歉时连眼睛都不敢抬。","ko_note":"나도 모르게 던진 말이 부끄러운 귀갓길.","ja":"相手のせいだと思っていたら自分の勘違いだった。謝る声が小さくなる。"},{"ko":"섭섭한","en":"hurt","strip":"#9da4c4","zh":"以为会被邀请，后来才知道大家早就约好了。","ko_note":"생일을 잊은 친구에게 섭섭한 마음이 든다.","ja":"何でも話していた友達から、大事な知らせだけ最後に聞いた。少し寂しい。"},{"ko":"쓸쓸한","en":"lonesome","strip":"#8e9ab0","zh":"散场后的街道还挂着彩灯，人却已经走光了。","ko_note":"시장 불이 꺼진 뒤 쓸쓸한 골목길 하나.","ja":"祭りの屋台が片づく夕方、商店街の灯りがぽつぽつ消えていく。"},{"ko":"외로운","en":"lonely","strip":"#7f86a4","zh":"拍了张晚饭的照片，想来想去，不知道发给谁。","ko_note":"단체 채팅방이 조용해질수록 외로운 밤.","ja":"夕飯の写真を撮ったのに、送る相手が思いつかなくてそのまま消す。"},{"ko":"죄스러운","en":"guilty","strip":"#b78f8b","zh":"那天说过的谎，到现在想起来还是心虚。","ko_note":"그날의 거짓말이 죄스러운 새벽을 깨운다.","ja":"ついた小さな嘘を、相手はまだ信じている。目を合わせづらい。"},{"ko":"후회스러운","en":"regretful","strip":"#a398b5","zh":"消息已经发出去了，却总想着当时为什么不换种说法。","ko_note":"보내 버린 메시지를 읽는 후회스러운 새벽.","ja":"帰りの電車で、言わなければよかったひと言を何度も思い返している。"},{"ko":"걱정되는","en":"worried","strip":"#8d9db7","zh":"家人说晚点回来，天黑了还没消息，电话又拨了一次。","ko_note":"늦은 버스를 기다리는 아이가 걱정되는 저녁.","ja":"台風が近づく夜、実家の屋根は大丈夫かと何度も天気予報を開く。"},{"ko":"그리운","en":"longing","strip":"#d4a18f","zh":"路过卖烤红薯的小摊，忽然很想念小时候的冬天。","ko_note":"비슷한 향기만 지나도 그리운 얼굴이 떠오른다.","ja":"駅の発車メロディーを聞くたびに、遠くで暮らすあの人の顔が浮かぶ。"},{"ko":"답답한","en":"constricted","strip":"#8698aa","zh":"话都到了嘴边，偏偏越着急越说不清楚。","ko_note":"입술 끝까지 차오른 말이 답답한 목을 막는다.","ja":"言いたいことほど言葉にならない。何度口を開いても止まってしまう。"},{"ko":"무기력한","en":"lethargic","strip":"#9ea3ad","zh":"闹钟响了三遍，明明醒着，还是没力气掀开被子。","ko_note":"해가 중천인데도 무기력한 몸은 이불 속이다.","ja":"布団から出たのに、何もする気が起きない。気づけばもう昼を過ぎていた。"},{"ko":"부담스러운","en":"pressured","strip":"#b99582","zh":"听到“这件事就交给你了”，高兴之余又有点发愁。","ko_note":"기대한다는 한마디가 부담스러운 저녁.","ja":"先輩から大事な役目を任される。うれしいのに、その重さで眠れない。"},{"ko":"씁쓸한","en":"bitter","strip":"#a28d77","zh":"同事升职了，我笑着恭喜他。回到座位才想起，自己也申请过那个职位。","ko_note":"친구의 축하 앞에서 씁쓸한 웃음을 삼킨다.","ja":"卒業式で笑って別れた。帰り道、結局あの人とは仲直りできなかったことを思い出した。"},{"ko":"아득한","en":"distant","strip":"#96a6b8","zh":"站在山顶往远处望，层层山影连着天边，怎么也看不到尽头。","ko_note":"졸업 뒤의 먼 계획이 아득한 안개처럼 남는다.","ja":"卒業後のことを考えてみる。予定は何も決まっていなくて、ずっと先の話のように感じる。"},{"ko":"우울한","en":"depressed","strip":"#7886a2","zh":"天气明明很好，窗帘却一整天都没拉开。","ko_note":"화창한 날에도 우울한 마음은 커튼을 닫는다.","ja":"梅雨の朝。起きてはみたけれど、外に出る気になれず、また布団に戻った。"}];
const collection={"version":3,"scope":["또! 오해영","멜로가 체질","모두가 자신의 무가치함과 싸우고 있다","나의 해방일지"],"dictionary":[{"lemma":"가라앉다","ko":"기운이나 기분이 낮아지다.","zh":"情绪低落下来；也指渐渐平静。","ja":"気分が沈む。興奮が静まる意味も。","example":"집에 오니 기분이 가라앉았다."},{"lemma":"겁나다","ko":"무슨 일이 생길까 두렵다.","zh":"害怕会发生什么，不敢面对。","ja":"何か起こりそうで怖い。","example":"혼자 가려니 겁이 난다."},{"lemma":"기쁘다","ko":"좋은 일이 있어 마음이 즐겁다.","zh":"遇到好事而高兴。","ja":"よいことがあってうれしい。","example":"다시 만나서 정말 기쁘다."},{"lemma":"당황스럽다","ko":"뜻밖의 일에 어떻게 할지 모르겠다.","zh":"事出突然，一时不知如何应对。","ja":"突然のことにどうしてよいか分からない。","example":"갑자기 질문을 받아 당황스러웠다."},{"lemma":"무섭다","ko":"위험하거나 두려운 느낌이 들다.","zh":"觉得可怕、令人畏惧。","ja":"危険を感じたり、おびえたりする。","example":"어두운 골목을 걷기가 무섭다."},{"lemma":"분하다","ko":"억울하거나 뜻대로 안 되어 화가 나다.","zh":"受了委屈或输了而气愤、不甘。","ja":"理不尽なことや失敗が悔しい。","example":"아깝게 져서 분했다."},{"lemma":"속상하다","ko":"일이 잘못되어 마음이 상하다.","zh":"事情不顺或受伤害而难受。","ja":"うまくいかず、心が傷つく。","example":"애써 만든 걸 잃어버려 속상하다."},{"lemma":"아쉽다","ko":"부족하거나 끝나는 것이 마음에 남다.","zh":"意犹未尽、舍不得；也指遗憾。","ja":"物足りない、名残惜しい、残念だ。","example":"벌써 헤어져야 한다니 아쉽다."},{"lemma":"원망스럽다","ko":"남의 탓으로 여겨 서운하고 밉다.","zh":"觉得是对方造成的，心里埋怨。","ja":"相手のせいだと思い、恨めしく感じる。","example":"약속을 잊은 친구가 원망스러웠다."},{"lemma":"즐겁다","ko":"하는 일이나 시간이 재미있고 좋다.","zh":"活动或相处让人愉快。","ja":"していることや過ごす時間が楽しい。","example":"같이 밥을 먹으며 즐겁게 이야기했다."},{"lemma":"가볍다","ko":"걱정이나 부담이 적어 마음이 편하다.","zh":"心里没什么负担，感到轻松。","ja":"心配や負担が少なく、気が軽い。","example":"일을 끝내니 마음이 가볍다."},{"lemma":"고단하다","ko":"몸이 지치고 생활이 힘겹다.","zh":"疲惫、辛苦，常带生活劳累感。","ja":"体が疲れ、暮らしも骨が折れる。","example":"하루 종일 서 있었더니 고단하다."},{"lemma":"긴장하다","ko":"마음이 조여 편히 있지 못하다.","zh":"精神绷紧，无法放松。","ja":"気が張って落ち着けない。","example":"발표를 앞두고 긴장했다."},{"lemma":"든든하다","ko":"믿고 의지할 것이 있어 안심이 되다.","zh":"有人或事可以依靠，心里踏实。","ja":"頼れるものがあって心強い。","example":"네가 옆에 있으니 든든하다."},{"lemma":"뭉클하다","ko":"감정이 갑자기 올라와 가슴이 찡하다.","zh":"情绪忽然涌上心头，鼻子一酸。","ja":"感情がこみ上げ、胸がじんとする。","example":"오래된 편지를 읽다가 뭉클해졌다."},{"lemma":"불안하다","ko":"나쁜 일이 생길 듯하여 마음이 놓이지 않다.","zh":"担心会出事，心里不安。","ja":"悪いことが起こりそうで落ち着かない。","example":"아직 연락이 없어서 불안하다."},{"lemma":"수줍다","ko":"남 앞에서 말하거나 행동하기를 어려워하다.","zh":"在别人面前害羞、拘谨。","ja":"人前で話したり振る舞ったりするのが恥ずかしい。","example":"수줍어서 먼저 말을 걸지 못했다."},{"lemma":"안타깝다","ko":"딱하거나 아쉬운 일을 보고 마음이 아프다.","zh":"看到令人惋惜或心疼的事而难过。","ja":"気の毒なことや惜しいことに胸が痛む。","example":"조금만 더 하면 됐는데 안타깝다."},{"lemma":"위축되다","ko":"기세가 꺾여 자신 있게 행동하지 못하다.","zh":"受到打击，畏缩、不敢表现。","ja":"気後れして、自信を持って動けない。","example":"계속 지적을 받으니 위축된다."},{"lemma":"지겹다","ko":"같은 일이 이어져 싫증이 나다.","zh":"因反复或持续太久而厌烦。","ja":"同じことが続いてうんざりする。","example":"같은 이야기를 또 듣자니 지겹다."},{"lemma":"가뿐하다","ko":"몸이나 마음이 무겁지 않고 산뜻하다.","zh":"身体或心情轻快、爽利。","ja":"体や気持ちが軽く、すっきりしている。","example":"푹 쉬었더니 몸이 가뿐하다."},{"lemma":"고독하다","ko":"홀로 있거나 깊이 혼자인 듯 느끼다.","zh":"孤独；也可指独处的状态。","ja":"独りでいる、または深い孤独を感じる。","example":"사람들 속에서도 고독할 때가 있다."},{"lemma":"낙담하다","ko":"기대가 무너져 기운을 잃다.","zh":"期待落空后泄气、灰心。","ja":"期待が外れて気落ちする。","example":"결과를 보고 낙담했다."},{"lemma":"들뜨다","ko":"기대나 기쁨에 마음이 차분하지 않다.","zh":"兴奋、雀跃，心静不下来。","ja":"期待や喜びで浮き浮きして落ち着かない。","example":"여행 전날이라 마음이 들떠 있다."},{"lemma":"뭔가 아닌 것 같다","ko":"딱 짚기는 어렵지만 맞지 않는 듯하다.","zh":"说不上来，但总觉得哪里不对。","ja":"はっきり言えないが、何か違う気がする。","example":"다들 좋다는데 나는 뭔가 아닌 것 같다."},{"lemma":"불쾌하다","ko":"마음에 거슬려 기분이 나쁘다.","zh":"让人不舒服、不愉快。","ja":"不快で嫌な気分になる。","example":"무례한 말에 불쾌해졌다."},{"lemma":"숨 막히다","ko":"숨쉬기 어렵거나 심하게 답답하다.","zh":"喘不过气；也形容压抑得难受。","ja":"息ができないほど苦しい。圧迫感にも使う。","example":"계속 감시받는 것 같아 숨이 막힌다."},{"lemma":"애틋하다","ko":"안타까움과 깊은 사랑이 함께 느껴지다.","zh":"深切眷恋，带一点心疼或不舍。","ja":"切なさを伴う深い愛情がある。","example":"멀리 사는 동생이 애틋하게 느껴진다."},{"lemma":"유쾌하다","ko":"기분이나 분위기가 밝고 즐겁다.","zh":"心情或气氛明快、愉悦。","ja":"気分や雰囲気が明るく楽しい。","example":"유쾌한 농담에 다 같이 웃었다."},{"lemma":"창피하다","ko":"남에게 드러난 일 때문에 부끄럽다.","zh":"出丑或被人看见而难堪。","ja":"人に見られたり知られたりして恥ずかしい。","example":"이름을 잘못 불러서 창피했다."},{"lemma":"가슴 아프다","ko":"슬픔이나 안타까움이 깊다.","zh":"悲伤或心疼得厉害。","ja":"悲しみや切なさで胸が痛む。","example":"그 소식을 들으니 가슴이 아프다."},{"lemma":"고요하다","ko":"소란함이 없이 조용하고 잠잠하다.","zh":"安静、平静，也可形容内心。","ja":"物音や騒ぎがなく静か。心にも使う。","example":"아침에는 마음도 고요하다."},{"lemma":"난처하다","ko":"어떻게 대응할지 몰라 곤란하다.","zh":"处境为难，不知如何应对。","ja":"どう対応すればよいか困る。","example":"둘 중 한 명을 고르라니 난처하다."},{"lemma":"떨떠름하다","ko":"마음에 썩 들지 않아 선뜻 내키지 않다.","zh":"不太满意，反应勉强、兴致不高。","ja":"あまり気が進まず、微妙な気持ちだ。","example":"갑자기 계획이 바뀌어 떨떠름했다."},{"lemma":"미심쩍다","ko":"확실하지 않아 의심이 들다.","zh":"觉得可疑，心里存疑。","ja":"はっきりせず、疑わしく感じる。","example":"설명이 자꾸 달라져 미심쩍다."},{"lemma":"불행하다","ko":"행복하지 못하거나 처지가 좋지 않다.","zh":"不幸福、不幸；不只是运气差。","ja":"幸せでない、または不幸な境遇にある。","example":"그때는 내가 불행하다고 생각했다."},{"lemma":"슬프다","ko":"잃거나 아픈 일로 마음이 서럽다.","zh":"因失去或伤心的事而悲伤。","ja":"つらいことや喪失で悲しい。","example":"이별을 생각하면 슬프다."},{"lemma":"포근하다","ko":"따뜻하고 부드러워 편안하다.","zh":"温暖柔和，让人安心。","ja":"暖かく柔らかく、安心できる。","example":"이 방은 작지만 포근하다."},{"lemma":"통쾌하다","ko":"답답함이 풀려 아주 시원하고 즐겁다.","zh":"憋闷解除，痛快、解气。","ja":"もやもやが晴れて、すかっとする。","example":"마침내 이겼을 때 정말 통쾌했다."},{"lemma":"초라하다","ko":"볼품없거나 자신이 작게 느껴지다.","zh":"寒酸、不起眼；也指自觉渺小。","ja":"みすぼらしい、または自分が惨めに感じられる。","example":"남과 비교하다 보니 내가 초라해졌다."},{"lemma":"간절하다","ko":"바라는 마음이 아주 깊고 크다.","zh":"愿望或心情非常迫切、真切。","ja":"願う気持ちが非常に強く切実だ。","example":"다시 만나고 싶은 마음이 간절하다."},{"lemma":"고통스럽다","ko":"몸이나 마음의 아픔이 심하다.","zh":"身体或精神上痛苦。","ja":"体や心の痛みがつらい。","example":"그 일을 떠올리는 것조차 고통스럽다."},{"lemma":"날아갈 듯하다","ko":"아주 기쁘고 몸과 마음이 가볍다.","zh":"高兴得像要飞起来。","ja":"飛び上がりそうなほど、うれしく気が軽い。","example":"합격 소식을 듣고 날아갈 듯했다."},{"lemma":"떨리다","ko":"긴장이나 감정으로 몸이나 마음이 흔들리다.","zh":"因紧张、激动等发抖或心颤。","ja":"緊張や感情で体や心が震える。","example":"무대에 서니 목소리가 떨린다."},{"lemma":"미안하다","ko":"남에게 잘못했거나 폐를 끼쳐 마음이 불편하다.","zh":"做错事或给人添麻烦，觉得抱歉。","ja":"悪いことや迷惑をかけて、申し訳ない。","example":"오래 기다리게 해서 미안하다."},{"lemma":"뿌듯하다","ko":"해낸 일 등이 만족스러워 마음이 차오르다.","zh":"做成了事情，心里充实、有成就感。","ja":"やり遂げたことに満足し、胸が満たされる。","example":"혼자 완성하고 나니 뿌듯하다."},{"lemma":"신나다","ko":"흥이 나서 기운이 넘치고 즐겁다.","zh":"兴致高涨，开心得来劲。","ja":"楽しくて気分が弾み、元気が出る。","example":"좋아하는 노래가 나오니 신난다."},{"lemma":"어리둥절하다","ko":"뜻밖의 일을 이해하지 못해 얼떨떨하다.","zh":"一时摸不着头脑，茫然。","ja":"意外なことが理解できず、きょとんとする。","example":"무슨 일이 생긴 건지 어리둥절했다."},{"lemma":"절망적이다","ko":"희망이 보이지 않는다.","zh":"看不到希望；令人绝望。","ja":"希望が見えず、絶望的だ。","example":"아무 방법도 없다니 절망적이다."},{"lemma":"충만하다","ko":"어떤 감정이나 기운이 가득하다.","zh":"某种情感或力量充盈心中。","ja":"ある感情や力がいっぱいに満ちている。","example":"함께 있는 시간은 기쁨으로 충만하다."},{"lemma":"갈망하다","ko":"무엇을 몹시 바라다.","zh":"强烈渴望某种东西。","ja":"何かを強く求め、切望する。","example":"오랫동안 자유를 갈망했다."},{"lemma":"공허하다","ko":"마음속이 빈 듯하고 의미가 느껴지지 않다.","zh":"内心空荡荡，感到空虚。","ja":"心が空っぽで、むなしく感じる。","example":"큰일을 끝냈는데 오히려 공허하다."},{"lemma":"넋 나가다","ko":"충격이나 몰입으로 정신을 차리지 못하다.","zh":"受冲击或看得入神，魂不守舍。","ja":"衝撃や夢中になることで、我を忘れる。","example":"놀라운 소식에 넋이 나갔다."},{"lemma":"막막하다","ko":"어찌할지 모르겠고 앞이 보이지 않다.","zh":"不知从何下手，看不到出路。","ja":"どうすればよいか、先が見えない。","example":"어디서부터 시작할지 막막하다."},{"lemma":"민망하다","ko":"쑥스럽거나 보기 거북해 마음이 불편하다.","zh":"尴尬、不好意思；也可替别人难堪。","ja":"気恥ずかしい、または見ていていたたまれない。","example":"나만 박수를 쳐서 민망했다."},{"lemma":"산뜻하다","ko":"깔끔하고 가벼워 새롭고 기분 좋다.","zh":"清新、利落，给人轻快感。","ja":"さっぱりして軽やかで、新鮮な感じだ。","example":"머리를 자르니 산뜻하다."},{"lemma":"실망하다","ko":"기대에 미치지 못해 마음이 상하다.","zh":"结果不如预期而失望。","ja":"期待どおりでなく、がっかりする。","example":"기대했던 답이 아니라 실망했다."},{"lemma":"어색하다","ko":"익숙하지 않거나 자연스럽지 않다.","zh":"不熟悉、不自然，或相处尴尬。","ja":"慣れずにぎこちない、不自然だ。","example":"처음 둘이 만나니 조금 어색하다."},{"lemma":"조급하다","ko":"빨리 이루려 하여 기다리기 어렵다.","zh":"心急，等不及事情发生。","ja":"早く進めたくて、待てずに焦る。","example":"시간이 얼마 없어 마음이 조급하다."},{"lemma":"평화롭다","ko":"다툼이나 걱정 없이 평온하다.","zh":"没有纷争或忧虑，平和安宁。","ja":"争いや心配がなく、穏やかだ。","example":"아무 일도 없는 오후가 평화롭다."},{"lemma":"감격스럽다","ko":"큰 기쁨이나 감동이 벅차오르다.","zh":"强烈的喜悦或感动涌上心头。","ja":"大きな喜びや感動で胸がいっぱいになる。","example":"드디어 다시 만나니 감격스럽다."},{"lemma":"괜찮다","ko":"상태가 나쁘지 않거나 문제없다.","zh":"状态还好、没问题；也可用于安慰。","ja":"悪くない、大丈夫だ。慰めにも使う。","example":"조금 쉬었더니 이제 괜찮다."},{"lemma":"놀랍다","ko":"예상 밖이거나 대단해서 놀랄 만하다.","zh":"出乎意料或了不起，令人惊讶。","ja":"予想外、または見事で驚くほどだ。","example":"혼자 해냈다니 놀랍다."},{"lemma":"만족스럽다","ko":"기대나 바람에 맞아 마음에 들다.","zh":"符合期待，让人满意。","ja":"望みや期待に合い、満足できる。","example":"이번 결과는 만족스럽다."},{"lemma":"반갑다","ko":"만나거나 소식을 들어 기쁘다.","zh":"见到人或听到消息而欣喜。","ja":"会ったり便りを聞いたりしてうれしい。","example":"오랜만에 보니 정말 반갑다."},{"lemma":"상쾌하다","ko":"몸이나 기분이 시원하고 개운하다.","zh":"身心清爽、舒畅。","ja":"体や気分がすがすがしく、爽快だ。","example":"아침 공기를 마시니 상쾌하다."},{"lemma":"심술 나다","ko":"괜히 남을 괴롭히거나 훼방 놓고 싶다.","zh":"闹别扭，偏想使坏或给人添堵。","ja":"つい意地悪や邪魔をしたくなる。","example":"나만 빼고 놀았다니 심술이 난다."},{"lemma":"어이없다","ko":"너무 뜻밖이거나 말이 안 되어 기막히다.","zh":"荒唐或出乎意料得让人无语。","ja":"あまりに意外、またはばかげていてあきれる。","example":"내 잘못이라니 어이가 없다."},{"lemma":"편안하다","ko":"몸이나 마음에 불편과 긴장이 없다.","zh":"身体或内心舒服、安稳。","ja":"体や心に苦しさや緊張がない。","example":"너와 있으면 마음이 편안하다."},{"lemma":"혼란스럽다","ko":"생각이나 상황이 뒤섞여 정리가 안 된다.","zh":"思绪或状况混乱，理不清。","ja":"考えや状況が入り混じり、整理できない。","example":"서로 다른 말을 들으니 혼란스럽다."},{"lemma":"감동적이다","ko":"마음을 깊이 움직이는 데가 있다.","zh":"事物令人深受感动。","ja":"人の心を深く動かすものがある。","example":"끝까지 서로 돕는 모습이 감동적이었다."},{"lemma":"괴롭다","ko":"마음이나 몸이 시달려 견디기 어렵다.","zh":"身心受折磨，难受、痛苦。","ja":"心や体が苦しく、耐えがたい。","example":"그 일을 혼자 감추고 있기가 괴롭다."},{"lemma":"다행스럽다","ko":"나쁜 일을 피하거나 잘되어 안심이 된다.","zh":"幸好避免坏事或结果顺利，松口气。","ja":"悪いことを免れたり、うまくいったりしてほっとする。","example":"아무도 다치지 않아 다행스럽다."},{"lemma":"멍하다","ko":"정신이 또렷하지 않고 생각이 잘 안 난다.","zh":"脑子发空、发懵，不清醒。","ja":"頭がぼんやりして、考えがまとまらない。","example":"잠을 못 자서 하루 종일 멍하다."},{"lemma":"버겁다","ko":"힘이나 능력으로 감당하기 어렵다.","zh":"超出承受能力，吃力、扛不住。","ja":"力や能力では抱えきれず、きつい。","example":"이 일을 혼자 맡기에는 버겁다."},{"lemma":"서럽다","ko":"외롭거나 억울하여 깊이 슬프다.","zh":"带孤独或委屈的心酸、悲伤。","ja":"寂しさや悔しさが重なり、悲しい。","example":"아픈데 혼자 있으니 서럽다."},{"lemma":"쑥스럽다","ko":"익숙하지 않거나 주목받아 부끄럽다.","zh":"不习惯或受到关注而难为情。","ja":"慣れないことや注目に照れくさい。","example":"칭찬을 받으니 쑥스럽다."},{"lemma":"억울하다","ko":"잘못 없이 불이익을 받아 분하다.","zh":"被冤枉或遭不公，觉得委屈。","ja":"悪くないのに不利益を受け、悔しい。","example":"하지도 않은 일로 혼나서 억울하다."},{"lemma":"좌절하다","ko":"뜻이 꺾여 의욕을 잃다.","zh":"目标受阻，挫败、意志消沉。","ja":"望みが阻まれて、くじける。","example":"계속 실패하자 좌절했다."},{"lemma":"홀가분하다","ko":"걱정이나 부담을 덜어 마음이 가볍다.","zh":"卸下牵挂或负担，如释重负。","ja":"心配や重荷がなくなり、気が軽い。","example":"마음에 걸리던 말을 하고 나니 홀가분하다."},{"lemma":"감사하다","ko":"받은 도움이나 호의를 고맙게 여기다.","zh":"对帮助或善意心怀感谢。","ja":"助けや好意をありがたく思う。","example":"곁에 있어 준 것이 감사하다."},{"lemma":"귀찮다","ko":"하기 싫고 번거롭게 느껴지다.","zh":"嫌麻烦，不想费事去做。","ja":"面倒で、やる気になれない。","example":"오늘은 설거지하기도 귀찮다."},{"lemma":"답답하다","ko":"일이 안 풀리거나 말이 안 통해 속이 막히다.","zh":"事情不顺或沟通不通，憋闷着急。","ja":"物事が進まず、話も通じず、もどかしい。","example":"아무리 설명해도 안 통하니 답답하다."},{"lemma":"못마땅하다","ko":"마음에 들지 않아 불만이 있다.","zh":"不满意、不以为然。","ja":"気に入らず、不満に思う。","example":"상의 없이 정한 게 못마땅하다."},{"lemma":"부끄럽다","ko":"잘못이 마음에 걸리거나 남 앞에서 수줍다.","zh":"惭愧；也可表示害羞，不只指羞耻。","ja":"恥じ入る。また、人前で恥ずかしい。","example":"내가 한 말을 떠올리니 부끄럽다."},{"lemma":"섭섭하다","ko":"기대했던 마음이나 대접에 못 미쳐 서운하다.","zh":"没得到期待中的关心，失落、委屈。","ja":"期待した気遣いがなく、寂しく残念だ。","example":"나한테만 말하지 않아서 섭섭하다."},{"lemma":"쓸쓸하다","ko":"혼자이거나 빈 듯하여 적적하다.","zh":"冷清、寂寥，带空落感。","ja":"独り、または空虚な感じで寂しい。","example":"손님들이 돌아가니 집이 쓸쓸하다."},{"lemma":"외롭다","ko":"함께할 사람이 없다고 느껴 쓸쓸하다.","zh":"觉得缺少陪伴或联结而孤单。","ja":"一緒にいる人やつながりがなく、寂しい。","example":"이야기할 사람이 없어서 외롭다."},{"lemma":"죄스럽다","ko":"잘못을 저지른 듯 마음이 무겁다.","zh":"觉得有愧、有罪过，内心不安。","ja":"罪を犯したように、申し訳なく心が重い。","example":"도와주지 못한 것이 죄스럽다."},{"lemma":"후회스럽다","ko":"지난 행동을 달리했으면 하고 바라다.","zh":"希望当初做法不同，感到后悔。","ja":"あの時、別のことをすればよかったと思う。","example":"그 말을 한 것이 후회스럽다."},{"lemma":"걱정되다","ko":"좋지 않은 일이 생길까 마음이 쓰이다.","zh":"担心发生不好的事，放不下心。","ja":"悪いことが起こらないか気にかかる。","example":"아직 집에 안 왔다니 걱정된다."},{"lemma":"그립다","ko":"떨어져 있는 사람이나 지난 때가 보고 싶다.","zh":"想念不在身边的人或过去时光。","ja":"離れた人や過ぎた日々が恋しい。","example":"가끔은 고향의 겨울이 그립다."},{"lemma":"답답하다","ko":"가슴이 막힌 듯하거나 표현이 잘 안 된다.","zh":"胸口憋闷；想说却表达不出。","ja":"胸が詰まる。言葉にできず、もどかしい。","example":"하고 싶은 말이 안 나와 답답하다."},{"lemma":"무기력하다","ko":"기운과 의욕이 없어 움직이기 어렵다.","zh":"缺乏力气和动力，提不起劲。","ja":"気力や意欲がなく、動くのがつらい。","example":"아무것도 할 기운이 없이 무기력하다."},{"lemma":"부담스럽다","ko":"책임이나 기대 등이 마음에 무겁게 느껴지다.","zh":"责任、期待等让人有压力。","ja":"責任や期待などが重荷に感じられる。","example":"너무 큰 기대를 받으니 부담스럽다."},{"lemma":"씁쓸하다","ko":"기쁘지만은 않고 아쉬움이나 허탈함이 남다.","zh":"心里有苦涩、遗憾或无奈。","ja":"苦い気持ちや、やるせなさが残る。","example":"결국 돈 문제였다는 게 씁쓸하다."},{"lemma":"아득하다","ko":"멀고 끝이 안 보이거나 생각이 흐릿하다.","zh":"遥远、渺茫；也可指记忆朦胧。","ja":"遠く果てしない。記憶がおぼろな意味も。","example":"어릴 때 일이 이제는 아득하다."},{"lemma":"우울하다","ko":"기분이 가라앉고 밝아지지 않다.","zh":"心情低落、郁闷；本身不等于诊断。","ja":"気分が沈んで晴れない。病名とは限らない。","example":"요즘은 별일이 없어도 우울하다."}],"records":[{"id":"R005","position":14,"show":"모두가 자신의 무가치함과 싸우고 있다","scene":{"ko":"누군가 시비를 걸자 형제가 함께 맞선다. 혼자 감당하지 않아도 된다.","zh":"有人找麻烦时，黄氏兄弟站到一起替对方说话。不是问题都解决了，而是终于不用一个人面对。","ja":"厄介な相手を前に、兄弟が並んで立つ。問題はまだ残っている。それでも、一人で向き合わなくていい。"},"quote":null,"match":"든든","source":{"type":"official_clip","title":"JTBC：黄氏兄弟替彼此撑腰","url":"https://tv.jtbc.co.kr/clip/pr10011927/pm10071855/vo10924312/view","caution":"标题「든든」是官网编辑的情绪提示，不是角色台词"},"episode":"12"},{"id":"R006","position":15,"show":"모두가 자신의 무가치함과 싸우고 있다","scene":{"ko":"동만과 경세가 오랜 갈등 끝에 속마음을 털어놓는다. 다시 예전처럼 지내고 싶다.","zh":"闹翻多年的朋友终于听见彼此的真心。黄东万哭着说想回到从前，两个人慢慢和解。","ja":"すれ違っていた二人が、やっと互いの本音を聞く。ドンマンは泣きながら、また昔のように戻りたいと伝える。"},"quote":null,"match":null,"source":{"type":"official_clip","title":"JTBC：黄东万、朴景世和解特辑","url":"https://tv.jtbc.co.kr/clip/pr10011927/pm10071855/vo10924369/view","caution":"官网摘要及片段时间码，不等于完整字幕"},"episode":"12"},{"id":"R001","position":16,"show":"모두가 자신의 무가치함과 싸우고 있다","scene":{"ko":"형이 원하는 것을 묻자 동만은 성공이나 행복보다 불안하지 않기를 바란다.","zh":"哥哥问黄东万想要什么。他没提成功，也没说幸福，只盼自己别再一直心慌。","ja":"兄に何が欲しいのかと聞かれたドンマンは、成功でも幸せでもなく、ただ不安でさえなければいいと答える。"},"quote":{"ko":"불안하지 않은 거.","zh":"不再焦虑。","ja":"不安じゃないこと。"},"match":"불안하지","source":{"type":"fan_transcription","title":"모자무싸 — 观剧者整理的角色对白与场景","url":"https://brunch.co.kr/@jennifernote/1034","caution":"二次听写，角色/措辞尚待对照正片或出版剧本"},"episode":null},{"id":"R015","position":20,"show":"나의 해방일지","scene":{"ko":"세 남매는 날마다 먼 길을 출퇴근한다. 같은 하루가 반복될수록 지쳐 간다.","zh":"《我的出走日记》里，三兄妹天天从京畿道奔波去上班。没有惊天动地的大事，疲惫却在每天的通勤里一点点累积。","ja":"『私の解放日誌』では、三きょうだいが京畿道から毎日長い時間をかけて通勤する。大事件は起きなくても、同じ毎日が少しずつ重くなる。"},"quote":null,"match":null,"source":{"type":"writer_interview","title":"씨네21：朴海英编剧访谈","url":"https://v.daum.net/v/7HHHdZnXGi","caution":"作者自述和采访者对剧情的描写，不当剧本逐字证据"},"episode":null},{"id":"R007","position":45,"show":"모두가 자신의 무가치함과 싸우고 있다","scene":{"ko":"경세가 혜진에게 잘못을 인정한다. 늦었지만 마침내 사과한다.","zh":"朴景世终于向高惠珍承认自己做错了事。那声道歉说得很迟，却还是说出来了。","ja":"ギョンセがヘジンに、これまでのことをようやく謝る。遅すぎたかもしれない。それでも口にした。"},"quote":{"ko":"잘못했어","zh":"是我错了。","ja":"私が悪かった。"},"match":null,"source":{"type":"official_clip","title":"JTBC：朴景世向高惠珍道歉","url":"https://tv.jtbc.co.kr/clip/pr10011927/pm10071855/vo10924324/view","caution":"官网确认场景，未核对逐字对白"},"episode":"12"},{"id":"R008","position":46,"show":"모두가 자신의 무가치함과 싸우고 있다","scene":{"ko":"오랫동안 데뷔하지 못했던 동만이 신인 감독상을 받는다.","zh":"二十年都没能正式拍电影的黄东万，终于站上领奖台，拿到新人导演奖。","ja":"二十年もの間、監督デビューできなかったドンマンが、新人監督賞の壇上に立つ。"},"quote":null,"match":null,"source":{"type":"official_clip","title":"JTBC：新人导演奖结尾","url":"https://tv.jtbc.co.kr/clip/pr10011927/pm10071855/vo10924357/view","caution":"官网确认场景，未核对逐字对白"},"episode":"12"},{"id":"R002","position":54,"show":"모두가 자신의 무가치함과 싸우고 있다","scene":{"ko":"은아는 어릴 때부터 앞이 보이지 않았던 마음을 떠올린다.","zh":"卞恩雅回想年轻时那种喘不过气、看不见出路的感觉。多年过去，处境仿佛仍没有改变。","ja":"ウンアは、若い頃の先が見えない息苦しさを思い返す。年月が過ぎても、同じところにいるような気がする。"},"quote":{"ko":"어려선 막막했는데","zh":"小时候觉得前路茫茫，可是……","ja":"子どもの頃は先が見えなかったけど。"},"match":"막막했는데","source":{"type":"fan_transcription","title":"모자무싸 — 观剧者整理的角色对白与场景","url":"https://brunch.co.kr/@jennifernote/1034","caution":"二次听写，角色/措辞尚待对照正片或出版剧本"},"episode":null},{"id":"R009","position":61,"show":"모두가 자신의 무가치함과 싸우고 있다","scene":{"ko":"영실을 찾았다는 소식에 진만이 눈물을 흘린다.","zh":"听说英实终于找到了，黄镇万当场掉下眼泪。绷了那么久的心，在听见消息那一刻松开了。","ja":"ヨンシルが見つかったと聞いたジンマンは、その場で涙をこぼす。張りつめていたものが、一気にほどけた。"},"quote":null,"match":null,"source":{"type":"official_clip","title":"JTBC：得知找到英实的消息","url":"https://tv.jtbc.co.kr/clip/pr10011927/pm10071855/vo10924336/view","caution":"官网确认场景，未核对逐字对白"},"episode":"12"},{"id":"R004","position":79,"show":"모두가 자신의 무가치함과 싸우고 있다","scene":{"ko":"동만은 오랫동안 영화를 만들지 못한 자신을 남보다 먼저 비웃는다.","zh":"做了二十年导演梦，作品始终拍不成。黄东万甚至拿自己的失败开玩笑，像是抢在别人贬低他之前先说出口。","ja":"監督を目指して二十年、まだ一本も撮れていない。ドンマンは人に笑われる前に、自分で自分を笑いものにする。"},"quote":null,"match":null,"source":{"type":"fan_transcription","title":"모자무싸 — 观剧者整理的角色对白与场景","url":"https://brunch.co.kr/@jennifernote/1034","caution":"二次听写，角色/措辞尚待对照正片或出版剧本"},"episode":null},{"id":"R003","position":83,"show":"모두가 자신의 무가치함과 싸우고 있다","scene":{"ko":"시사회 뒤 모임에서 동만이 영화를 칭찬하는 동료의 말을 날카롭게 받아친다.","zh":"电影试映会后的聚餐上，别人说电影挺好看，黄东万却当众呛了一句，弄得大家都下不来台。","ja":"試写会後の席で、作品を褒めた仲間にドンマンが噛みつく。周囲はすっかり気まずくなってしまう。"},"quote":{"ko":"답답한 소리 하지 말라","zh":"别说这种让人着急的话。","ja":"そんなもどかしいことを言うな。"},"match":"답답한","source":{"type":"film_criticism","title":"씨네21：불편함은 어디서 오는가","url":"https://cine21.com/news/view/?mag_id=109903","caution":"将影评人的分析与剧中引语分开"},"episode":"1"},{"id":"S001","position":28,"show":"또! 오해영","quote":{"ko":"난 내가 여전히 애틋하고 잘 되길 바란다","zh":"我还是心疼自己，希望自己过得好。","ja":"それでも自分がいとおしいし、幸せになってほしい。"},"scene":{"ko":"해영은 늘 비교당했어도 다른 사람이 되고 싶었던 건 아니라고 말한다.","zh":"海英回忆起总被比较的学生时代。她希望自己能好一点，却不想变成另一个人。","ja":"比べられてばかりだった学生時代。それでもヘヨンは、別の人になりたかったわけではないと言う。"},"match":"애틋하고","episode":3,"source":{"title":"OSEN · 서현진표 사이다 명대사","url":"https://v.daum.net/v/Jnq5seoNnT","type":"press_cited_dialogue"}},{"id":"S002","position":67,"show":"또! 오해영","quote":{"ko":"언젠가 나 때문에 울거야. 울길 바래","zh":"总有一天你会为我哭的。我希望你哭。","ja":"いつか私のことで泣くよ。泣けばいい。"},"scene":{"ko":"자기를 좋아하지 않는다는 도경에게 해영은 상처받은 마음을 쏟아낸다.","zh":"听见道京说不喜欢自己，海英也想让他尝尝难过的滋味。","ja":"好きではないと言われたヘヨンは、ドギョンにもつらい思いをしてほしくなる。"},"match":null,"episode":7,"source":{"title":"OSEN · 서현진표 사이다 명대사","url":"https://v.daum.net/v/Jnq5seoNnT","type":"press_cited_dialogue"}},{"id":"S003","position":30,"show":"또! 오해영","quote":{"ko":"사랑은 쪽팔리지 않습니다","zh":"爱一个人，不丢人。","ja":"人を好きになるのは、恥ずかしいことじゃない。"},"scene":{"ko":"마음을 드러내고 돌아온 해영은 혼자 자신을 다독인다.","zh":"把心意全说了出来，回家后海英一遍遍告诉自己：这没什么可丢人的。","ja":"気持ちをさらけ出したあと、ヘヨンは一人で、恥ずかしくないと自分に言い聞かせる。"},"match":"쪽팔리지","episode":7,"source":{"title":"OSEN · 서현진표 사이다 명대사","url":"https://v.daum.net/v/Jnq5seoNnT","type":"press_cited_dialogue"}},{"id":"S004","position":92,"show":"또! 오해영","quote":{"ko":"와줘. 보고 싶어","zh":"来吧。我想你了。","ja":"来て。会いたい。"},"scene":{"ko":"도경이 먼저 전화를 걸어 해영에게 와 달라고 말한다.","zh":"道京终于主动打来电话，说想见她。","ja":"ドギョンのほうから電話をかけ、会いたいと伝える。"},"match":null,"episode":10,"source":{"title":"OSEN · 에릭의 심쿵유발 명대사","url":"https://v.daum.net/v/Jwvm5HpLfH","type":"press_cited_dialogue"}},{"id":"S005","position":15,"show":"또! 오해영","quote":{"ko":"먹는거 예쁜데?","zh":"你吃东西的样子很好看啊。","ja":"食べてるところ、かわいいけど。"},"scene":{"ko":"먹는 모습 때문에 버림받았다고 믿던 해영에게 도경이 다르게 말해 준다.","zh":"曾被嫌弃吃相的海英，听见道京说，她吃东西的样子很好看。","ja":"食べる姿が嫌だと振られたヘヨンに、ドギョンは、かわいいと言ってくれる。"},"match":null,"episode":null,"source":{"title":"OSEN · 에릭의 심쿵유발 명대사","url":"https://v.daum.net/v/Jwvm5HpLfH","type":"press_cited_dialogue"}},{"id":"S006","position":77,"show":"또! 오해영","quote":{"ko":"있던 거야","zh":"本来就有的。","ja":"もともと持ってただけ。"},"scene":{"ko":"생일 선물을 건네면서도 도경은 일부러 준비한 게 아닌 척한다.","zh":"明明带来了生日礼物，道京却装作只是手边刚好有。","ja":"誕生日の贈り物を渡しながら、ドギョンはわざわざ用意したのではないふりをする。"},"match":null,"episode":null,"source":{"title":"OSEN · 에릭의 심쿵유발 명대사","url":"https://v.daum.net/v/Jwvm5HpLfH","type":"press_cited_dialogue"}},{"id":"S007","position":88,"show":"또! 오해영","scene":{"ko":"해영은 비어 있는 옆방을 향해 도경에게 일찍 와 달라고 말한다.","zh":"隔壁空着，海英对着那间房说，希望道京能早点回来。","ja":"隣の部屋は空っぽ。ヘヨンはその部屋に向かって、早く帰ってきてほしいと訴える。"},"match":"","episode":5,"source":{"title":"엑스포츠뉴스 · 종영 명장면","url":"https://www.xportsnews.com/article/740038","type":"press_cited_dialogue"}},{"id":"S008","position":44,"show":"멜로가 체질","quote":{"ko":"좋아해, 너","zh":"我喜欢你。","ja":"好きだよ、君のこと。"},"scene":{"ko":"환동이 술의 힘을 빌려 진주에게 마음을 고백한다.","zh":"焕东喝了几口酒，终于对珍珠说出了喜欢。","ja":"ファンドンは酒を少し飲んで、ようやくジンジュに好きだと伝える。"},"match":null,"episode":null,"source":{"title":"JTBC · 진주의 현실 연애","url":"https://mtv.jtbc.co.kr/photo/pr10011072/pm10053955/detail/15158?site_preference=mobile","type":"official_editorial_quote"}},{"id":"S009","position":96,"show":"멜로가 체질","quote":{"ko":"고생했던 내 마음을 잊지 못해서지.","zh":"是忘不了自己那颗受过苦的心。","ja":"苦しかった自分の気持ちが忘れられないの。"},"scene":{"ko":"진주는 옛 연인보다 그 관계에서 애썼던 자신을 돌아본다.","zh":"珍珠放不下的，与其说是旧爱，不如说是那段关系里辛苦过的自己。","ja":"忘れられないのは元恋人というより、あの恋で苦しんでいた自分。"},"match":null,"episode":null,"source":{"title":"JTBC · 진주의 현실 연애","url":"https://mtv.jtbc.co.kr/photo/pr10011072/pm10053955/detail/15158?site_preference=mobile","type":"official_editorial_quote"}},{"id":"S010","position":42,"show":"멜로가 체질","quote":{"ko":"감춰진 나를 스스로 본다는 게, 어쩐지 좀 아파.","zh":"看见藏起来的那个自己，不知怎么，有点痛。","ja":"隠していた自分を自分で見るのは、なんだか少し痛い。"},"scene":{"ko":"진주는 마음속에 감춰 둔 자신의 모습을 마주하는 아픔을 말한다.","zh":"珍珠谈到，亲眼看清自己藏起来的那一面，也会疼。","ja":"ジンジュは、隠していた自分の一面と向き合う痛みを語る。"},"match":"아파","episode":8,"source":{"title":"MK스포츠 · 임진주, 8회","url":"https://www.mk.co.kr/news/entertain/8962986","type":"press_cited_dialogue"}},{"id":"S011","position":16,"show":"멜로가 체질","quote":{"ko":"마음이란 건 믿을만한 보안 체계가 없어.","zh":"人心没有什么靠得住的安保系统。","ja":"心には、頼れるセキュリティーなんてない。"},"scene":{"ko":"진주는 마음을 안전하게 지킬 방법이 없다는 생각을 말한다.","zh":"珍珠觉得，心里的防线并没有自己以为的那么可靠。","ja":"ジンジュは、自分の心を確実に守る仕組みなんてないと考える。"},"match":null,"episode":8,"source":{"title":"MK스포츠 · 임진주, 8회","url":"https://www.mk.co.kr/news/entertain/8962986","type":"press_cited_dialogue"}},{"id":"S012","position":31,"show":"멜로가 체질","quote":{"ko":"안아줘","zh":"抱抱我。","ja":"抱きしめて。"},"scene":{"ko":"슬픔을 견디던 은정이 친구들에게 아픔을 털어놓고 안아 달라고 한다.","zh":"恩静终于向朋友说出自己的痛苦，请她们抱抱自己。","ja":"ウンジョンはようやく友人たちに苦しさを打ち明け、抱きしめてほしいと頼む。"},"match":null,"episode":null,"source":{"title":"ART INSIGHT · 은정의 포옹 장면","url":"https://www.artinsight.co.kr/news/view.php?no=55604","type":"review_cited_dialogue"}},{"id":"S013","position":52,"show":"나의 해방일지","quote":{"ko":"난 한 번도 채워진 적이 없어.","zh":"我从来没有被填满过。","ja":"一度も満たされたことがないの。"},"scene":{"ko":"미정은 구씨에게 자신이 느끼는 빈자리를 털어놓는다.","zh":"美贞向具氏说起心里的空缺，希望能有一次真正被填满。","ja":"ミジョンはク氏に心の空白を打ち明け、一度でいいから満たされたいと願う。"},"match":null,"episode":null,"source":{"title":"중앙일보 · 추앙을 청하는 미정","url":"https://www.joongang.co.kr/article/25066287","type":"press_cited_dialogue"}},{"id":"S014","position":16,"show":"나의 해방일지","quote":{"ko":"이불 속에서도 사람들 속에서도 불안하고","zh":"躲在被子里也好，待在人群里也好，都不安。","ja":"布団の中でも、人の中にいても、不安で。"},"scene":{"ko":"미정은 혼자 있어도 사람들과 있어도 마음이 놓이지 않는다고 말한다.","zh":"美贞说，不管独处还是和人在一起，心里都安定不下来。","ja":"一人でも誰かといても、ミジョンの心は落ち着かない。"},"match":"불안하고","episode":11,"source":{"title":"뉴스엔 · 미정의 고백, 11회","url":"https://v.daum.net/v/20220514225614561","type":"press_cited_dialogue"}},{"id":"S015","position":37,"show":"나의 해방일지","quote":{"ko":"나는 왜 늘 슬플까.","zh":"我为什么总是难过呢。","ja":"私はどうして、いつも悲しいんだろう。"},"scene":{"ko":"미정은 자신이 왜 남들처럼 밝게 웃지 못하는지 구씨에게 묻는다.","zh":"美贞把藏在心里的问题说给具氏听：为什么自己总是这样难过。","ja":"ミジョンは胸にしまっていた問いをク氏に話す。どうしていつも悲しいのだろう。"},"match":"슬플까","episode":11,"source":{"title":"뉴스엔 · 미정의 고백, 11회","url":"https://v.daum.net/v/20220514225614561","type":"press_cited_dialogue"}},{"id":"S016","position":62,"show":"나의 해방일지","quote":{"ko":"5분만 숨통 트여도 살 만하잖아.","zh":"哪怕只有五分钟能喘口气，也能活下去啊。","ja":"五分だけでも息がつけたら、なんとかやっていけるでしょ。"},"scene":{"ko":"미정은 온종일 좋지 않아도 짧게 숨 돌릴 순간을 모으며 산다고 말한다.","zh":"美贞告诉具氏，一天不必从头到尾都好过。能喘口气的片刻，也可以一点点攒起来。","ja":"一日中よい日でなくてもいい。ミジョンは、少し息をつける時間を集めて暮らしている。"},"match":null,"episode":15,"source":{"title":"파이낸셜뉴스 · 재회, 15회","url":"https://www.fnnews.com/news/202205291151025326","type":"press_cited_dialogue"}},{"id":"S017","position":14,"show":"나의 해방일지","quote":{"ko":"날 잡아주는구나","zh":"他在拉住我啊。","ja":"私を引き留めてくれるんだ。"},"scene":{"ko":"전 남자친구의 결혼식에서 무너질 듯한 미정에게 구씨의 전화가 온다.","zh":"在前男友的婚礼上，美贞正要任自己失控，具氏的电话打了过来。","ja":"元恋人の結婚式で自分を見失いそうなミジョンに、ク氏から電話がかかってくる。"},"match":null,"episode":15,"source":{"title":"파이낸셜뉴스 · 재회, 15회","url":"https://www.fnnews.com/news/202205291151025326","type":"press_cited_dialogue"}},{"id":"S018","position":73,"show":"나의 해방일지","quote":{"ko":"정말 다행이에요","zh":"真是太好了。","ja":"本当によかったです。"},"scene":{"ko":"태훈은 기정이 임신하지 않았다는 말에 안도하지만 그 말은 기정을 아프게 한다.","zh":"得知基贞没有怀孕，泰勋松了口气。可这句庆幸，对基贞来说却很刺耳。","ja":"ギジョンが妊娠していないと知り、テフンは安堵する。その言葉はギジョンを傷つける。"},"match":"다행이에요","episode":15,"source":{"title":"파이낸셜뉴스 · 재회, 15회","url":"https://www.fnnews.com/news/202205291151025326","type":"press_cited_dialogue"}},{"id":"S019","position":2,"show":"나의 해방일지","quote":{"ko":"겁 나.","zh":"我害怕。","ja":"怖いんだ。"},"scene":{"ko":"구씨는 앞으로 자신이 어떻게 변할지 몰라 두렵다고 미정에게 말한다.","zh":"具氏害怕自己以后会变成什么样，害怕会怎样对待美贞。","ja":"これから自分がどうなり、ミジョンにどう接してしまうか分からない。ク氏はそれを恐れている。"},"match":"겁 나","episode":15,"source":{"title":"파이낸셜뉴스 · 재회, 15회","url":"https://www.fnnews.com/news/202205291151025326","type":"press_cited_dialogue"}},{"id":"S020","position":6,"show":"모두가 자신의 무가치함과 싸우고 있다","quote":{"ko":"내 인생이 왜 네 맘에 들어야 되는데요?","zh":"我的人生为什么非得让你满意？","ja":"僕の人生が、どうして君の気に入らなきゃいけないんですか。"},"scene":{"ko":"실패한 인생으로 취급받던 동만은 남의 기준에 맞춰야 하느냐고 되묻는다.","zh":"总被当作失败者的东万，反问别人：自己的人生为什么要合他们的意。","ja":"失敗した人間のように扱われるドンマンは、他人を満足させるための人生なのかと問い返す。"},"match":null,"episode":null,"source":{"title":"연합뉴스 · 무가치함과 싸우는 모두에게","url":"https://www.yna.co.kr/view/AKR20260426036900005","type":"press_cited_dialogue"}},{"id":"S021","position":19,"show":"모두가 자신의 무가치함과 싸우고 있다","quote":{"ko":"난 만만하고 약한 애가 아니라 얌전한 애","zh":"我不是好欺负、软弱，我只是安静。","ja":"私は弱くて甘く見ていい人じゃない。おとなしいだけ。"},"scene":{"ko":"은아는 자신을 함부로 대하는 대표에게 더는 조용히 참지만은 않겠다는 뜻을 전한다.","zh":"面对随意轻慢自己的老板，恩雅终于开口：安静不等于可以被欺负。","ja":"ぞんざいに扱う代表に、ウンアは初めて言い返す。おとなしいからといって、弱いわけではない。"},"match":null,"episode":null,"source":{"title":"연합뉴스 · 무가치함과 싸우는 모두에게","url":"https://www.yna.co.kr/view/AKR20260426036900005","type":"press_cited_dialogue"}},{"id":"T001","position":90,"positions":[90,8],"show":"멜로가 체질","quote":{"ko":"나도 당연히 후회도 하고 아쉽기도 하고 근데 지금은 조금 달라.","zh":"我当然也后悔，也觉得遗憾。不过现在有点不一样了。","ja":"もちろん後悔もしたし、心残りもある。でも今は少し違う。"},"scene":{"ko":"지난 연애를 돌아보며 아쉬움은 남아도 앞으로의 시간이 더 기대된다고 말한다.","zh":"谈起过去的恋情，遗憾还在，但对以后的期待已经慢慢超过了后悔。","ja":"過去の恋に心残りはある。それでも、これからへの期待が後悔を上回り始めている。"},"match":"후회","episode":12,"source":{"title":"매일경제 — 멜로가 체질 명대사","url":"https://www.mk.co.kr/news/culture/9002017","type":"press_cited_dialogue"}},{"id":"T002","position":62,"positions":[62],"show":"멜로가 체질","quote":{"ko":"괜찮아, 사랑했던 사람은 원래 평생 신경 쓰이는 사람으로 남는 거니까.","zh":"没关系，爱过的人，本来就会让你在意一辈子。","ja":"大丈夫。好きだった人は、もともと一生気になる人として残るものだから。"},"scene":{"ko":"옛 연인이 신경 쓰이는 마음을 이상하게 여기지 않아도 된다는 위로다.","zh":"明明已经分开，却还在意对方。有人告诉你，不用为这件事责怪自己。","ja":"別れたのに、まだ相手が気になる。そんな自分を責めなくていいという慰め。"},"match":"괜찮아","episode":null,"source":{"title":"매일경제 — 멜로가 체질 명대사","url":"https://www.mk.co.kr/news/culture/9002017","type":"press_cited_dialogue"}},{"id":"T003","position":51,"positions":[51],"show":"나의 해방일지","quote":{"ko":"나는 갈망하다가 뒈질 거야. 사랑을 줘, 나도 줄게.","zh":"我会渴望到死的。给我爱吧，我也给你。","ja":"求め続けて、くたばるんだろうな。愛をちょうだい、私もあげる。"},"scene":{"ko":"현아는 아무리 사랑을 받아도 채워지지 않는 마음을 미정에게 털어놓는다.","zh":"贤雅对美贞说，自己好像永远都想要更多的爱，怎么也填不满。","ja":"ヒョナはミジョンに、どれだけ愛されてもまだ足りない気持ちを話す。"},"match":"갈망하다가","episode":4,"source":{"title":"나의 해방일지 — 회차별 대사 정리","url":"https://www.namu.moe/w/%EB%82%98%EC%9D%98%20%ED%95%B4%EB%B0%A9%EC%9D%BC%EC%A7%80/%EB%AA%85%EB%8C%80%EC%82%AC","type":"fan_transcribed_dialogue"}},{"id":"T004","position":69,"positions":[69],"show":"나의 해방일지","quote":{"ko":"편안하고 좋을 때도 그게 싫어서 깨버리려고 확 마셔.","zh":"就连舒服、开心的时候，也会讨厌那种感觉，猛灌酒想把它打破。","ja":"穏やかで気分がいい時も、それが嫌で、壊そうとして一気に飲む。"},"scene":{"ko":"구씨는 편안한 순간조차 견디기 어려운 자신을 미정에게 설명한다.","zh":"具氏向美贞坦白，自己有时连平静舒服的片刻都不敢接受。","ja":"ク氏はミジョンに、穏やかな時間さえ受け入れられない自分を打ち明ける。"},"match":"편안하고","episode":16,"source":{"title":"iMBC — 마지막 회의 구씨와 미정","url":"https://enews.imbc.com/News/ViewAmp/349322","type":"press_cited_dialogue"}},{"id":"T005","position":50,"positions":[50],"show":"나의 해방일지","quote":{"ko":"마음에 사랑밖에 없어. 그래서 느낄 게 사랑밖에 없어","zh":"心里除了爱什么都没有，所以能感觉到的也只有爱。","ja":"心に愛しかない。だから、感じるものも愛しかない。"},"scene":{"ko":"마지막에 미정은 자신을 사랑스럽게 느끼며 마음이 달라졌음을 말한다.","zh":"到了最后，美贞发现自己竟然这么可爱，心里的感受也跟以前不一样了。","ja":"最後にミジョンは、自分をいとおしく思う。心にあるものが、以前とは変わっていた。"},"match":null,"episode":16,"source":{"title":"iMBC — 마지막 회의 구씨와 미정","url":"https://enews.imbc.com/News/ViewAmp/349322","type":"press_cited_dialogue"}},{"id":"T006","position":91,"positions":[91],"show":"멜로가 체질","quote":{"ko":"숨소리가 조금... 걱정돼","zh":"你的呼吸声有点……让人担心。","ja":"息遣いがちょっと……心配。"},"scene":{"ko":"뛰어온 매니저에게 뛰지 않아도 된다며 숨소리를 걱정한다.","zh":"经纪人跑着过来，对方让他不用跑，又忍不住担心他的呼吸声。","ja":"走ってきたマネージャーに、走らなくていいと声をかける。荒い息遣いが気になる。"},"match":"걱정돼","episode":9,"source":{"title":"멜로가 체질 9회 — 22:14–22:18","url":"https://ybstory.tistory.com/109","type":"fan_transcribed_dialogue"}},{"id":"T007","position":88,"positions":[88],"show":"멜로가 체질","quote":{"ko":"같이 하던 스태프들 없이 가려니까 뭔가... 외로워","zh":"要离开一起干活的那些人，自己往前走，总觉得……有点孤单。","ja":"いつものスタッフがいないまま進めようとすると、なんか……寂しい。"},"scene":{"ko":"범수는 익숙한 스태프들 없이 촬영을 시작하려니 외롭다고 친구에게 말한다.","zh":"要和熟悉的工作人员分开拍戏，凡秀对朋友承认，心里还是有点孤单。","ja":"いつものスタッフなしで撮影に入る。ボムスは友人に、やはり寂しいと漏らす。"},"match":"외로워","episode":9,"source":{"title":"멜로가 체질 9회 — 34:45–34:49","url":"https://ybstory.tistory.com/109","type":"fan_transcribed_dialogue"}},{"id":"T008","position":78,"positions":[78,65],"show":"또! 오해영","quote":{"ko":"반갑다. 나만 아프면 억울 할 뻔했는데 너도 아파서 반가워","zh":"真高兴。差点以为只有我一个人痛苦，那也太委屈了。原来你也难受。","ja":"うれしいよ。俺だけ苦しかったら悔しいところだった。君も苦しくて、うれしい。"},"scene":{"ko":"병원에서 도경은  drawers.push(drawer);
 setActionLabel(drawer);
 tile.addEventListener('click',()=>{
   if(drawer.stage==='closed' && tile.dataset.available==='false')return;
   if(drawer.stage==='closed')openGloss(drawer);
   else if(drawer.stage==='gloss'){
     if(lang==='en')retract(drawer);
     else extendAndPrint(drawer);
   }
   else if(drawer.stage==='full')foldToGloss(drawer);
   else retract(drawer);
 });
 paper.addEventListener('transitionend',event=>{
   if(event.propertyName!=='transform'||drawer.stage!=='closed')return;
   tile.classList.remove('open');
   drawer.scene.textContent='';
   drawer.printedLang=null;
 });
 wall.append(tile);
}
// Preserve the original desktop English exactly. On phones, measure the
// glyphs themselves (not scrollWidth's rounded overflow) and reduce only
// their font size, keeping the tip's line height fixed.
function fitTranslations(){
  const mobile=matchMedia('(max-width:600px)').matches;
  for(const drawer of drawers){
    const el=drawer.translation;
    if(!mobile){
      el.style.fontSize='';
      el.style.transform='';
      const available=el.clientWidth;
      const wanted=el.scrollWidth;
      if(available>0 && wanted>available)
        el.style.transform='scaleX('+Math.max(.68,(available-1)/wanted).toFixed(3)+')';
      continue;
    }
    el.style.transform='none';
    el.style.fontSize='';
    const available=el.clientWidth-1.5;
    if(available<=0)continue;
    const range=document.createRange();
    range.selectNodeContents(el);
    const textWidth=()=>range.getBoundingClientRect().width;
    const normalSize=parseFloat(getComputedStyle(el).fontSize);
    const naturalWidth=textWidth();
    if(naturalWidth<=available)continue;
    // No 6px floor: on a narrow phone it could leave the final letters cut
    // off. The extra width in the mobile strip keeps reductions modest.
    let size=Math.max(4,normalSize*available/naturalWidth);
    el.style.fontSize=size.toFixed(3)+'px';
    for(let n=0;n<4 && textWidth()>available;n++){
      size*=available/textWidth()*.99;
      el.style.fontSize=size.toFixed(3)+'px';
    }
  }
}
titleState();
recolor();
// Reserve actual space below the wall for the lowest open paper. Merely adding
// a tail AFTER the footer lets a long sheet paint over the citation and footer.
function syncPageSpacing(){
 const tileHeight=wall.getBoundingClientRect().height/14;
 page.style.setProperty('--row-height',tileHeight+'px');
 const citation=document.querySelector('.citation');
 const currentExtra=parseFloat(getComputedStyle(page).getPropertyValue('--paper-clearance'))||0;
 const originalTop=citation.getBoundingClientRect().top-currentExtra;
 const bottom=Math.max(-Infinity,...drawers.filter(d=>d.stage==='full').map(d=>
   d.tile.getBoundingClientRect().bottom+(d.paperLength||0)));
 const needed=Number.isFinite(bottom)?Math.max(0,Math.ceil(bottom+18-originalTop)):0;
 page.style.setProperty('--paper-clearance',needed+'px');
 const tail=document.getElementById('tail-space');
 tail.style.height='0px';
}
syncPageSpacing();
requestAnimationFrame(syncPageSpacing);
fitTranslations();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{modePaperLengths.clear();drawers.filter(d=>d.stage==='full').forEach(fitScene);syncPageSpacing();fitTranslations();});
let lastWallWidth=wall.getBoundingClientRect().width;
window.addEventListener('resize',()=>{
  const currentWidth=wall.getBoundingClientRect().width;
  // Mobile toolbars trigger height-only resizes; don't reflow all papers then.
  if(Math.abs(currentWidth-lastWallWidth)<1)return;
  lastWallWidth=currentWidth;
  fitTranslations();
  drawers.filter(d=>d.stage==='full').forEach(fitScene);
  syncPageSpacing();
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape')drawers.forEach(d=>{if(d.stage!=='closed')retract(d)});
});

</script>
