<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Immerse</title><style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { margin: 0; background: #fff; color: #5a4450; font: 16px system-ui; }
main { position: fixed; inset: 0; display: grid; place-items: center; padding: clamp(12px, 3vmin, 32px); height: 100%; height: 100dvh; }
main > svg { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; overflow: visible; }
svg [role=button] { cursor: pointer; transition: filter .18s; }
svg [role=button]:hover, svg [role=button]:focus-visible { filter: brightness(1.08); outline: none; stroke: #5a4450; stroke-width: .5; stroke-opacity: .6; }

/* The dialog frame follows the fill color of the piece used to open it. */
dialog {
  --panel-color: #fcf1df;
  --panel-ink: #5a4450;
  border: 0;
  padding: 12px 12px 0;
  width: min(96vw, calc((100dvh - 140px) * 16 / 9 + 24px));
  max-width: 96vw;
  max-height: calc(100dvh - 24px);
  overflow: hidden;
  color: var(--panel-ink);
  background: var(--panel-color);
}
dialog:focus { outline: none; }
dialog::backdrop { background: #5a445055; backdrop-filter: blur(3px); }
dialog header { display: flex; justify-content: flex-end; align-items: center; margin: 0 0 8px; }
#close {
  appearance: none;
  display: grid;
  place-items: center;
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
#close:hover { opacity: .7; }
/* Intentional keyboard focus is indicated without a square border around the X. */
#close:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 5px; }
iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #fff; }
/* A single footer strip: the text shares the video's left edge and is centered vertically. */
dialog .slogan-line {
  display: flex;
  align-items: center;
  min-height: 48px;
  margin: 0;
  padding: 0 0 0 0.5em;
  font-size: 13px;
  line-height: 1.35;
}
.slogan-line a { display: inline-block; color: inherit; text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 600px) {
  /* Phone-only paper card: 90vw panel, roughly 16px side padding on 390px phones. */
  dialog {
    background: #fff;
    color: #5a4450;
    width: 90vw;
    max-width: 90vw;
    margin-inline: auto;
    inset-inline: 0;
    padding: 0 4.1vw;
  }
  /* The close control has its own 44px touch area; no extra space below it. */
  dialog header { margin-bottom: 0; }
  /* Align the 44px close hit area with the outer white card edge,
     rather than the inner video edge; the glyph shifts right by one side gutter. */
  dialog #close { flex-basis: 44px; width: 44px; height: 44px; margin-right: -4.1vw; }
  dialog iframe { margin-inline: auto; }
  dialog .slogan-line { font-size: 12px; font-weight: 600; }
}
/* On desktop, grow just the colored side rails by 4px each.
   Expand the outer dialog by 8px to keep the video and X exactly in place.
   Touch-first tablets continue to use the earlier layout. */
@media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
  dialog {
    padding-inline: 16px;
    width: min(calc(96vw + 8px), calc((100dvh - 140px) * 16 / 9 + 32px));
    max-width: calc(96vw + 8px);
  }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const modal = document.querySelector('dialog');
const frame = modal.querySelector('iframe');
let lastDoorway = null;
const doorways = [
  {parts:['rect1-5','rect2-3-4-6','rect2-3-4-7'],video:'dO0qyt74-YQ',label:'Upper-left bottom block'},
  {parts:['rect1-7','rect2-6','rect2'],video:'zb_PL4oUN9g',label:'Upper-right square'},
  {parts:['rect1-4-8-8','rect2-6-2-4-4'],video:'dXy4Pad61b4',label:'Upper-left rectangle'},
  {parts:['path7','path7-9'],video:'5AIlsU3N7tg',label:'Upper-right circle'},
  {parts:['rect1-4-8','rect2-6-2-4'],video:'1vQ_kd3qDus',label:'Lower-left rectangle'},
  {parts:['path7-8','path7-9-7'],video:'Fs-KHW7OfRM',label:'Lower-right circle'},
  {parts:['rect1-7-9','rect2-6-4','rect2-8'],video:'2MSGGPz5p4k',label:'Lower-right square'}
];

// Keep the chosen panel color tied to the original SVG rather than a duplicate palette.
function colorContrast(rgb, other) {
  const linear = value => {
    value /= 255;
    return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
  };
  const luminance = c => .2126 * linear(c[0]) + .7152 * linear(c[1]) + .0722 * linear(c[2]);
  const a = luminance(rgb), b = luminance(other);
  return (Math.max(a,b) + .05) / (Math.min(a,b) + .05);
}
function usePieceColor(piece) {
  const fill = getComputedStyle(piece).fill;
  const channels = (fill.match(/[\d.]+/g) || []).slice(0,3).map(Number);
  // The palette uses opaque fills, but leave a safe neutral fallback if that changes.
  if (channels.length !== 3) return;
  const cream = [252,241,223], plum = [90,68,80];
  const ink = colorContrast(channels, cream) >= 4.5 ? '#fcf1df' :
              colorContrast(channels, plum) >= 4.5 ? '#5a4450' : '#ffffff';
  modal.style.setProperty('--panel-color', fill);
  modal.style.setProperty('--panel-ink', ink);
}
for (const {parts,video,label} of doorways) {
  const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const first = document.getElementById(parts[0]);
  first.before(group);
  for (const id of parts) group.append(document.getElementById(id));
  group.setAttribute('role', 'button');
  group.setAttribute('tabindex', '0');
  group.setAttribute('aria-label', 'Play video: ' + label);
  group.setAttribute('aria-haspopup', 'dialog');
  function open() {
    lastDoorway = group;
    usePieceColor(first);
    frame.src = 'https://www.youtube-nocookie.com/embed/' + video;
    modal.showModal();
    // Avoid the browser's automatic focus ring on the X when the dialog opens.
    modal.focus({preventScroll:true});
  }
  group.addEventListener('click', open);
  group.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
}
document.getElementById('close').addEventListener('click', () => modal.close());
modal.addEventListener('close', () => {
  frame.removeAttribute('src');
  if (lastDoorway) lastDoorway.focus({preventScroll:true});
});
// Clicking the background does not close the player; only X and Escape do.
</script></html>
